<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>זיגי קופץ בין הזמנים</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 10%,#67439e,transparent 45%),linear-gradient(120deg,#111638,#075e69);font-family:Arial,sans-serif;color:white;text-align:center}.wrap{max-width:1050px;margin:auto;padding:16px}.back{color:white;display:inline-block;margin:8px}h1{font-size:clamp(25px,4vw,42px);margin:12px}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#ffffff20;border-radius:15px;padding:13px 22px;font-size:20px;font-weight:bold}.board{position:relative;margin:15px auto;max-width:960px;border:5px solid #cbb9ff;border-radius:19px;overflow:hidden;background:#8bd7ff;box-shadow:0 16px 35px #0006}canvas{width:100%;display:block;touch-action:none}.help{font-size:17px;margin:12px}.controls{display:flex;justify-content:center;gap:16px;direction:ltr;margin:10px}.controls button{font-size:28px;width:76px;height:62px;border:2px solid #cdbbff;border-radius:17px;background:#fff;color:#5131a1;touch-action:none;user-select:none}.overlay{position:fixed;inset:0;background:#101333b9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:4}.overlay[hidden]{display:none}.modal{background:#fffaff;color:#33224e;width:min(620px,100%);border-radius:24px;padding:25px;box-shadow:0 20px 70px #0008}.modal h2{color:#7044bf}.english{direction:ltr;font-size:clamp(22px,4vw,30px);font-weight:bold;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button,.mainbtn{background:#7650c9;border:0;border-radius:14px;color:white;font-size:18px;font-weight:bold;padding:16px;cursor:pointer}.answers button.wrong{background:#d93f62}.answers button.good{background:#20a875}.note{min-height:45px;font-weight:bold;margin:12px 0}.bonus{color:#1a9b64;font-weight:bold}.mainbtn{margin:8px}.small{font-size:14px;color:#715c90}@media(max-width:550px){.hud{font-size:15px}.modal{padding:18px}.controls button{width:68px;height:58px}}</style></head><body><main class="wrap"><a class="back" href="grammar-planet-10.html">↩️ חזרה לגשר הזמנים</a><h1>👽⭐ זיגי קופץ בין הזמנים!</h1><div class="hud"><span id="stars">⭐ 0 / 10</span><span id="points">🏆 0 נקודות</span><span id="boost">✨ השאלה הבאה: ×1</span></div><div class="board"><canvas id="world" width="960" height="420" aria-label="משחק פלטפורמות עם זיגי וכוכבים"></canvas></div><div class="help">🎮 משחק ארקייד: קופצים על מפלצות, מכים בקוביות סימן שאלה מלמטה, מדלגים מעל צינורות ואוספים כוכבים לשאלות!</div><div class="controls"><button id="left" aria-label="שמאלה">◀</button><button id="jump" aria-label="קפיצה">⬆</button><button id="right" aria-label="ימינה">▶</button></div><p>💜 כל תשובה נכונה שווה 100 נקודות. אחרי הצלחה יש <b>סיכוי של 40%</b> שהשאלה הבאה תהיה שווה פי 2!</p></main><div class="overlay" id="overlay" hidden><div class="modal"><h2 id="heading">⭐ שאלת כוכב!</h2><div class="english" id="question"></div><div class="answers"><button id="simple" onclick="answer('simple')">☀️ PRESENT SIMPLE</button><button id="progressive" onclick="answer('progressive')">🌠 PRESENT PROGRESSIVE</button></div><div class="note" id="note" aria-live="polite"></div><button class="mainbtn" id="continue" onclick="resume()" hidden>🚀 ממשיכים לקפוץ!</button><button class="mainbtn" id="again" onclick="restart()" hidden>🔁 משחק חדש</button><div class="small" id="hint"></div></div></div><script>
const questions=[["She plays basketball every Sunday.","simple","Every Sunday מתאר הרגל."],["I am doing my homework now.","progressive","AM + ING ו־now מציינים פעולה שקורית עכשיו."],["They usually eat lunch at school.","simple","Usually מתאר הרגל."],["Look! The dog is running.","progressive","Look! מצביע על מה שקורה עכשיו."],["He doesn't like coffee.","simple","זו העדפה קבועה."],["We are studying for a test this week.","progressive","This week מתאר תקופה זמנית."],["My sister walks to school every day.","simple","Every day מציין שגרה."],["Are you watching TV right now?","progressive","ARE + ING בשאלה על עכשיו."],["The sun rises in the east.","simple","זו עובדה כללית."],["I am not sleeping now.","progressive","AM NOT + ING מתאר פעולה בהווה ממושך."],["Does she play the piano?","simple","DOES משמש לשאלות בהווה פשוט."],["Listen! Someone is singing.","progressive","Listen! מצביע על פעולה שקורית כעת."],["We always visit grandma on Fridays.","simple","Always מציין הרגל."],["He is wearing a green shirt today.","progressive","כאן מתארים מה הוא לובש כרגע."],["Birds build nests.","simple","זו עובדה כללית."],["They are playing in the garden.","progressive","ARE + ING מתאר פעולה שקורית כעת."],["My dad works at a bank.","simple","זו עובדה על עבודה קבועה."],["She is reading a book at the moment.","progressive","At the moment מציין עכשיו."],["I often drink water.","simple","Often מציין תדירות."],["We are staying here this month.","progressive","This month מתאר מצב זמני."]];
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let keys={left:false,right:false,jump:false},x=65,y=305,vx=0,vy=0,onGround=false,camera=0,paused=false,finished=false,collected=0,points=0,multiplier=1,active=null,answered=false,queue=[];const floor=370,worldWidth=5100,platforms=[{x:0,y:370,w:worldWidth,h:50}];const pipes=[];for(let i=0;i<10;i++){let px=590+i*450,h=70+(i%3)*23;pipes.push({x:px,y:370-h,w:68,h});platforms.push({x:px,y:370-h,w:68,h:12})}for(let i=0;i<9;i++){let px=280+i*495;platforms.push({x:px,y:230-(i%2)*24,w:100,h:22})}ctx.imageSmoothingEnabled=false;let enemies=[],blocks=[],lives=3,invincible=0,frame=0,blockFlash=0;function setup(){stars=Array.from({length:10},(_,i)=>({x:340+i*440,y:315,got:false}));enemies=Array.from({length:12},(_,i)=>({x:440+i*360,base:440+i*360,dir:i%2?1:-1,y:343,alive:true}));blocks=Array.from({length:9},(_,i)=>({x:330+i*650,y:155,used:false}));lives=3;invincible=0;frame=0;queue=[...questions].sort(()=>Math.random()-.5).slice(0,10);x=65;y=305;vx=vy=0;camera=0;collected=0;points=0;multiplier=1;paused=false;finished=false;active=null;updateHud()}function updateHud(){$('stars').textContent='⭐ '+collected+' / 10';$('points').textContent='🏆 '+points+' נקודות';$('boost').textContent='✨ השאלה הבאה: ×'+multiplier}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function palm(px,py){for(let i=0;i<9;i++){rect(px,py-i*15,18,15,i%2?'#a66a38':'#cb894c');rect(px+3,py-i*15,5,6,'#e7ae64');rect(px+12,py-i*15+8,5,5,'#784b2c')}let top=py-135;for(let j=-3;j<=3;j++){let tx=px+8+j*21,ty=top+Math.abs(j)*7;rect(Math.min(px+8,tx),ty,Math.abs(j)*21+18,9,'#167a45');rect(tx-9,ty+5,20,8,'#259a48');rect(tx-6,ty+13,10,7,'#126d3c')}rect(px+4,top-4,13,11,'#288e47')}function draw(){frame++;ctx.clearRect(0,0,960,420);rect(0,0,960,420,'#8bd6f0');for(let i=0;i<14;i++){let hx=i*105-(camera*.23%105);ctx.fillStyle=i%2?'#9ecdc0':'#a8d6c7';ctx.beginPath();ctx.arc(hx+40,352,85,Math.PI,0);ctx.fill()}rect(0,354,960,66,'#b5d9b8');ctx.save();ctx.translate(-Math.floor(camera),0);for(let i=0;i<worldWidth;i+=520){palm(i+135,355);palm(i+175,355)}for(let p of platforms){if(p.x+p.w<camera||p.x>camera+960)continue;if(p.y===370){rect(p.x,p.y,p.w,50,'#a86b39');rect(p.x,p.y,p.w,11,'#42b842');for(let j=0;j<p.w;j+=32){rect(p.x+j,p.y+11,2,38,'#754a2b');rect(p.x+j+9,p.y+24,12,4,'#d39857')}}else if(!pipes.some(pipe=>pipe.x===p.x)){rect(p.x,p.y,p.w,p.h,'#d68e38');rect(p.x,p.y,p.w,5,'#f6c85b');for(let j=0;j<p.w;j+=25){rect(p.x+j,p.y+6,2,p.h-6,'#8b5c31');rect(p.x+j+7,p.y+11,8,4,'#f4b552')}}}for(let p of pipes){rect(p.x+6,p.y+10,p.w-12,p.h-10,'#189b38');rect(p.x+11,p.y+10,10,p.h-10,'#72dc63');rect(p.x+p.w-19,p.y+10,9,p.h-10,'#08702d');rect(p.x,p.y,p.w,17,'#159c37');rect(p.x+5,p.y+3,13,11,'#83e56c');rect(p.x+p.w-11,p.y+3,7,11,'#08632b');rect(p.x,p.y+16,p.w,4,'#086b30')}for(let b of blocks){let bx=b.x,by=b.y-(blockFlash===bx?7:0);rect(bx,by,44,39,b.used?'#a97845':'#efb63f');rect(bx+3,by+3,38,33,b.used?'#c69c6b':'#f9ce5a');ctx.font='bold 30px monospace';ctx.fillStyle='#8b571e';ctx.fillText(b.used?'·':'?',bx+12,by+30);rect(bx+46,by,44,39,'#d99738');rect(bx+49,by+3,38,33,'#f3b54d')}for(let e of enemies){if(!e.alive)continue;let ex=Math.round(e.x),ey=e.y;rect(ex+3,ey+8,29,18,'#9c623b');rect(ex+8,ey+2,19,9,'#b47a4a');rect(ex,ey+14,35,9,'#854c31');rect(ex+8,ey+12,6,8,'#fff');rect(ex+22,ey+12,6,8,'#fff');rect(ex+10,ey+15,3,5,'#252037');rect(ex+24,ey+15,3,5,'#252037');rect(ex+4,ey+26,11,4,'#533a31');rect(ex+21,ey+26,11,4,'#533a31')}for(let star of stars){if(star.got)continue;ctx.save();ctx.translate(star.x,star.y);ctx.fillStyle='#ffe14d';ctx.strokeStyle='#b97518';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?11:22;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();rect(-8,-3,4,6,'#7a4e18');rect(5,-3,4,6,'#7a4e18');ctx.restore()}/* Pixel-art Ziggy: large green head, antennas, violet suit, visible feet */let px=Math.round(x),py=Math.round(y);if(invincible>0&&frame%8<4){ctx.restore();return}rect(px+6,py+29,10,11,'#5932a4');rect(px+22,py+29,10,11,'#5932a4');rect(px+3,py+37,15,5,'#29244c');rect(px+20,py+37,15,5,'#29244c');rect(px+3,py+22,33,13,'#7146c6');rect(px+12,py+25,15,6,'#b4a0f5');rect(px+16,py-7,4,10,'#267a44');rect(px+13,py-10,9,6,'#64f48e');rect(px+4,py+2,32,24,'#39d973');rect(px+1,py+8,5,13,'#168c4d');rect(px+35,py+8,4,13,'#168c4d');rect(px+9,py+9,9,11,'#171f3e');rect(px+23,py+9,9,11,'#171f3e');rect(px+11,py+10,3,4,'#ffffff');rect(px+25,py+10,3,4,'#ffffff');rect(px+17,py+22,8,3,'#9b307b');ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 17px monospace';ctx.fillText('ZIGGY  ×  '+lives,24,25);ctx.fillText('⭐ '+collected+'/10',430,25);ctx.fillText('WORLD  10',805,25)}function tick(){if(!paused&&!finished){if(invincible>0)invincible--;for(let e of enemies){if(!e.alive)continue;e.x+=e.dir*.65;if(Math.abs(e.x-e.base)>65)e.dir*=-1}vx=(keys.right?4.2:0)-(keys.left?4.2:0);x=Math.max(0,Math.min(worldWidth-40,x+vx));if(keys.jump&&onGround){vy=-12;onGround=false}let oldBottom=y+41,oldTop=y;vy=Math.min(13,vy+.6);y+=vy;onGround=false;for(let p of platforms){if(x+30>p.x&&x<p.x+p.w&&oldBottom<=p.y+5&&y+41>=p.y&&vy>=0){y=p.y-41;vy=0;onGround=true}}for(let b of blocks){if(!b.used&&vy<0&&x+33>b.x&&x<b.x+44&&oldTop>=b.y+39&&y<=b.y+39){y=b.y+39;vy=2;b.used=true;blockFlash=b.x;setTimeout(()=>blockFlash=0,200);points+=25;updateHud();}}for(let e of enemies){if(!e.alive||x+32<e.x||x>e.x+35||y+39<e.y||y>e.y+29)continue;if(vy>1&&oldBottom<=e.y+12){e.alive=false;vy=-8;points+=50;updateHud()}else if(invincible===0){lives--;invincible=95;vx=-5;vy=-6;if(lives<=0){paused=true;$('overlay').hidden=false;$('heading').textContent='💜 זיגי צריך עוד ניסיון!';$('question').textContent='המפלצות תפסו את זיגי. אפשר להתחיל מחדש!';$('hint').textContent='קפצו על המפלצות מלמעלה כדי לנצח אותן.';$('simple').hidden=true;$('progressive').hidden=true;$('continue').hidden=true;$('again').hidden=false;$('note').textContent='אספתם '+collected+' כוכבים!';break}}}if(y>440){x=Math.max(30,x-160);y=100;vy=0}camera=Math.max(0,Math.min(worldWidth-960,x-300));for(let s of stars){if(!s.got&&Math.abs(x+17-s.x)<36&&Math.abs(y+18-s.y)<38){s.got=true;paused=true;active=queue[collected];showQuestion();break}}}draw();requestAnimationFrame(tick)}function showQuestion(){$('simple').hidden=false;$('progressive').hidden=false;answered=false;$('overlay').hidden=false;$('heading').textContent='⭐ כוכב '+(collected+1)+' מתוך 10'+(multiplier===2?' — ✨ בונוס כפול!':'');$('question').textContent=active[0];$('note').textContent='';$('hint').textContent='בחרו את הזמן המתאים למשפט';$('continue').hidden=true;$('again').hidden=true;for(let id of ['simple','progressive']){$(id).disabled=false;$(id).className=''}}function answer(choice){if(answered)return;let b=$(choice);if(choice!==active[1]){b.classList.add('wrong');$('note').textContent='🔴 כמעט! '+active[2]+' נסו שוב 💜';setTimeout(()=>b.classList.remove('wrong'),800);return}answered=true;b.classList.add('good');$('simple').disabled=$('progressive').disabled=true;points+=100*multiplier;collected++;let was=multiplier;multiplier=Math.random()<.4?2:1;updateHud();$('note').textContent='🟢 נכון! '+active[2]+(was===2?' זכיתם ב־200 נקודות!':'');$('hint').textContent=collected<10?(multiplier===2?'✨ מזל טוב! הכוכב הבא שווה פי 2!':'⭐ ממשיכים לכוכב הבא!'):'';if(collected===10){finished=true;$('heading').textContent='🏆 כל הכוכבים נאספו!';$('question').textContent='זיגי הצליח לעבור את גשר הזמנים! 👽💜';$('continue').hidden=true;$('again').hidden=false;$('note').textContent='צברתם '+points+' נקודות!'}else $('continue').hidden=false}function resume(){$('overlay').hidden=true;paused=false}function restart(){$('overlay').hidden=true;$('simple').hidden=false;$('progressive').hidden=false;setup()}function setKey(k,v){if(k==='ArrowLeft'||k==='a')keys.left=v;if(k==='ArrowRight'||k==='d')keys.right=v;if(k==='ArrowUp'||k===' '||k==='w')keys.jump=v}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();setKey(e.key,true)});window.addEventListener('keyup',e=>setKey(e.key,false));for(let [id,key] of [['left','left'],['right','right'],['jump','jump']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}setup();requestAnimationFrame(tick);
</script></body></html>
