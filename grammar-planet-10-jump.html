<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>זיגי קופץ בין הזמנים</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 10%,#67439e,transparent 45%),linear-gradient(120deg,#111638,#075e69);font-family:Arial,sans-serif;color:white;text-align:center}.wrap{max-width:1050px;margin:auto;padding:16px}.back{color:white;display:inline-block;margin:8px}h1{font-size:clamp(25px,4vw,42px);margin:12px}.hud{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#ffffff20;border-radius:15px;padding:13px 22px;font-size:20px;font-weight:bold}.board{position:relative;margin:15px auto;max-width:960px;border:5px solid #cbb9ff;border-radius:19px;overflow:hidden;background:#8bd7ff;box-shadow:0 16px 35px #0006}canvas{width:100%;display:block;touch-action:none}.help{font-size:17px;margin:12px}.controls{display:flex;justify-content:center;gap:16px;direction:ltr;margin:10px}.controls button{font-size:28px;width:76px;height:62px;border:2px solid #cdbbff;border-radius:17px;background:#fff;color:#5131a1;touch-action:none;user-select:none}.overlay{position:fixed;inset:0;background:#101333b9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:4}.overlay[hidden]{display:none}.modal{background:#fffaff;color:#33224e;width:min(620px,100%);border-radius:24px;padding:25px;box-shadow:0 20px 70px #0008}.modal h2{color:#7044bf}.english{direction:ltr;font-size:clamp(22px,4vw,30px);font-weight:bold;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button,.mainbtn{background:#7650c9;border:0;border-radius:14px;color:white;font-size:18px;font-weight:bold;padding:16px;cursor:pointer}.answers button.wrong{background:#d93f62}.answers button.good{background:#20a875}.note{min-height:45px;font-weight:bold;margin:12px 0}.bonus{color:#1a9b64;font-weight:bold}.mainbtn{margin:8px}.small{font-size:14px;color:#715c90}@media(max-width:550px){.hud{font-size:15px}.modal{padding:18px}.controls button{width:68px;height:58px}}</style></head><body><main class="wrap"><a class="back" href="grammar-planet-10.html">↩️ חזרה לגשר הזמנים</a><h1>👽⭐ זיגי קופץ בין הזמנים!</h1><div class="hud"><span id="stars">⭐ 0 / 10</span><span id="points">🏆 0 נקודות</span><span id="boost">✨ השאלה הבאה: ×1</span></div><div class="board"><canvas id="world" width="960" height="420" aria-label="משחק פלטפורמות עם זיגי וכוכבים"></canvas></div><div class="help">🎮 זזים עם החצים וקופצים עם רווח או ↑. אספו כוכבים כדי לענות על שאלות!</div><div class="controls"><button id="left" aria-label="שמאלה">◀</button><button id="jump" aria-label="קפיצה">⬆</button><button id="right" aria-label="ימינה">▶</button></div><p>💜 כל תשובה נכונה שווה 100 נקודות. אחרי הצלחה יש <b>סיכוי של 40%</b> שהשאלה הבאה תהיה שווה פי 2!</p></main><div class="overlay" id="overlay" hidden><div class="modal"><h2 id="heading">⭐ שאלת כוכב!</h2><div class="english" id="question"></div><div class="answers"><button id="simple" onclick="answer('simple')">☀️ PRESENT SIMPLE</button><button id="progressive" onclick="answer('progressive')">🌠 PRESENT PROGRESSIVE</button></div><div class="note" id="note" aria-live="polite"></div><button class="mainbtn" id="continue" onclick="resume()" hidden>🚀 ממשיכים לקפוץ!</button><button class="mainbtn" id="again" onclick="restart()" hidden>🔁 משחק חדש</button><div class="small" id="hint"></div></div></div><script>
const questions=[["She plays basketball every Sunday.","simple","Every Sunday מתאר הרגל."],["I am doing my homework now.","progressive","AM + ING ו־now מציינים פעולה שקורית עכשיו."],["They usually eat lunch at school.","simple","Usually מתאר הרגל."],["Look! The dog is running.","progressive","Look! מצביע על מה שקורה עכשיו."],["He doesn't like coffee.","simple","זו העדפה קבועה."],["We are studying for a test this week.","progressive","This week מתאר תקופה זמנית."],["My sister walks to school every day.","simple","Every day מציין שגרה."],["Are you watching TV right now?","progressive","ARE + ING בשאלה על עכשיו."],["The sun rises in the east.","simple","זו עובדה כללית."],["I am not sleeping now.","progressive","AM NOT + ING מתאר פעולה בהווה ממושך."],["Does she play the piano?","simple","DOES משמש לשאלות בהווה פשוט."],["Listen! Someone is singing.","progressive","Listen! מצביע על פעולה שקורית כעת."],["We always visit grandma on Fridays.","simple","Always מציין הרגל."],["He is wearing a green shirt today.","progressive","כאן מתארים מה הוא לובש כרגע."],["Birds build nests.","simple","זו עובדה כללית."],["They are playing in the garden.","progressive","ARE + ING מתאר פעולה שקורית כעת."],["My dad works at a bank.","simple","זו עובדה על עבודה קבועה."],["She is reading a book at the moment.","progressive","At the moment מציין עכשיו."],["I often drink water.","simple","Often מציין תדירות."],["We are staying here this month.","progressive","This month מתאר מצב זמני."]];
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let keys={left:false,right:false,jump:false},x=65,y=305,vx=0,vy=0,onGround=false,camera=0,paused=false,finished=false,collected=0,points=0,multiplier=1,active=null,answered=false,queue=[];const floor=370,worldWidth=5100,platforms=[{x:0,y:370,w:worldWidth,h:50}];for(let i=0;i<15;i++){let px=220+i*315;platforms.push({x:px,y:265-(i%3)*35,w:150,h:18})}let stars=[];function setup(){stars=Array.from({length:10},(_,i)=>({x:340+i*440,y:i%2===0?213:290,got:false}));queue=[...questions].sort(()=>Math.random()-.5).slice(0,10);x=65;y=305;vx=vy=0;camera=0;collected=0;points=0;multiplier=1;paused=false;finished=false;active=null;updateHud()}function updateHud(){$('stars').textContent='⭐ '+collected+' / 10';$('points').textContent='🏆 '+points+' נקודות';$('boost').textContent='✨ השאלה הבאה: ×'+multiplier}function draw(){ctx.clearRect(0,0,960,420);let sky=ctx.createLinearGradient(0,0,0,420);sky.addColorStop(0,'#7fc9ff');sky.addColorStop(1,'#d7f4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,960,420);ctx.save();ctx.translate(-camera,0);for(let i=0;i<worldWidth;i+=300){ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(i+90,65+(i%4)*22,32,0,Math.PI*2);ctx.arc(i+128,65+(i%4)*22,43,0,Math.PI*2);ctx.fill()}for(let p of platforms){if(p.x+p.w<camera||p.x>camera+960)continue;ctx.fillStyle='#19a55d';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#0b8047';ctx.fillRect(p.x,p.y+12,p.w,p.h-12);ctx.fillStyle='#a8f574';ctx.fillRect(p.x,p.y,p.w,7);ctx.fillStyle='#f7fffd';for(let j=10;j<p.w;j+=37)ctx.fillRect(p.x+j,p.y+11,5,5)}for(let s of stars){if(s.got)continue;ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#ffda39';ctx.strokeStyle='#d98a00';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,r=i%2?12:24;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}ctx.fillStyle='#39db83';ctx.beginPath();ctx.arc(x+17,y+16,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222344';ctx.beginPath();ctx.ellipse(x+11,y+13,5,7,0,0,Math.PI*2);ctx.ellipse(x+24,y+13,5,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4c236c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+18,y+20,6,0,Math.PI);ctx.stroke();ctx.fillStyle='#6c44bd';ctx.fillRect(x+3,y+33,28,8);ctx.restore();if(finished){ctx.fillStyle='#0008';ctx.fillRect(0,0,960,420)}}function tick(){if(!paused&&!finished){vx=(keys.right?4.2:0)-(keys.left?4.2:0);x=Math.max(0,Math.min(worldWidth-40,x+vx));if(keys.jump&&onGround){vy=-12;onGround=false}let oldBottom=y+41;vy=Math.min(13,vy+.6);y+=vy;onGround=false;for(let p of platforms){if(x+30>p.x&&x<p.x+p.w&&oldBottom<=p.y+5&&y+41>=p.y&&vy>=0){y=p.y-41;vy=0;onGround=true}}if(y>440){x=Math.max(30,x-160);y=100;vy=0}camera=Math.max(0,Math.min(worldWidth-960,x-300));for(let s of stars){if(!s.got&&Math.abs(x+17-s.x)<36&&Math.abs(y+18-s.y)<38){s.got=true;paused=true;active=queue[collected];showQuestion();break}}}draw();requestAnimationFrame(tick)}function showQuestion(){answered=false;$('overlay').hidden=false;$('heading').textContent='⭐ כוכב '+(collected+1)+' מתוך 10'+(multiplier===2?' — ✨ בונוס כפול!':'');$('question').textContent=active[0];$('note').textContent='';$('hint').textContent='בחרו את הזמן המתאים למשפט';$('continue').hidden=true;$('again').hidden=true;for(let id of ['simple','progressive']){$(id).disabled=false;$(id).className=''}}function answer(choice){if(answered)return;let b=$(choice);if(choice!==active[1]){b.classList.add('wrong');$('note').textContent='🔴 כמעט! '+active[2]+' נסו שוב 💜';setTimeout(()=>b.classList.remove('wrong'),800);return}answered=true;b.classList.add('good');$('simple').disabled=$('progressive').disabled=true;points+=100*multiplier;collected++;let was=multiplier;multiplier=Math.random()<.4?2:1;updateHud();$('note').textContent='🟢 נכון! '+active[2]+(was===2?' זכיתם ב־200 נקודות!':'');$('hint').textContent=collected<10?(multiplier===2?'✨ מזל טוב! הכוכב הבא שווה פי 2!':'⭐ ממשיכים לכוכב הבא!'):'';if(collected===10){finished=true;$('heading').textContent='🏆 כל הכוכבים נאספו!';$('question').textContent='זיגי הצליח לעבור את גשר הזמנים! 👽💜';$('continue').hidden=true;$('again').hidden=false;$('note').textContent='צברתם '+points+' נקודות!'}else $('continue').hidden=false}function resume(){$('overlay').hidden=true;paused=false}function restart(){$('overlay').hidden=true;setup()}function setKey(k,v){if(k==='ArrowLeft'||k==='a')keys.left=v;if(k==='ArrowRight'||k==='d')keys.right=v;if(k==='ArrowUp'||k===' '||k==='w')keys.jump=v}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();setKey(e.key,true)});window.addEventListener('keyup',e=>setKey(e.key,false));for(let [id,key] of [['left','left'],['right','right'],['jump','jump']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[key]=false)}setup();requestAnimationFrame(tick);
</script></body></html>
