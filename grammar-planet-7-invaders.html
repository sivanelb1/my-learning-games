<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Invaders · PLAYWISE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#45256f,transparent 45%),radial-gradient(ellipse at 85% 90%,#0a6070,transparent 50%),#0a102c;color:#fff;font-family:Arial,sans-serif;min-height:100vh}a{color:#e2faff}.back{display:inline-block;padding:11px 16px;margin:14px;background:#443175;color:white;border-radius:12px;text-decoration:none}.wrap{width:min(900px,96%);margin:auto;padding-bottom:45px}h1{text-align:center;color:#ffe49c;font-size:clamp(30px,5vw,46px);margin:8px 0}p.intro{text-align:center;line-height:1.6}.panel{background:#fcfaff;color:#372751;border-radius:22px;padding:clamp(14px,3vw,24px);margin:16px auto}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:bold;flex-wrap:wrap}.bar{height:11px;background:#e4d9f6;border-radius:20px;margin:13px 0;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#9864d5,#42c5ae);transition:width .25s}.question{text-align:center;background:#eee8fc;border-radius:15px;padding:16px 10px;margin:12px 0;font-size:clamp(19px,3vw,27px);font-weight:bold;direction:ltr}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:12px auto}.btn{border:0;background:#7653c5;color:white;border-radius:13px;padding:12px 19px;font-size:17px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e7defa;color:#543a88}.message{min-height:32px;text-align:center;font-size:17px;font-weight:bold;color:#694aa0}.game{position:relative;width:min(640px,100%);margin:auto;touch-action:none}canvas{width:100%;height:auto;display:block;border:3px solid #9e85e4;border-radius:17px;background:#0b1641;touch-action:none}.hint{text-align:center;font-size:14px;color:#74618f}.end{text-align:center;padding:35px 15px}.end h2{font-size:32px}.end p{font-size:20px}.hidden{display:none!important}.vocab-word{border-bottom:1px dashed #a37cd8;cursor:pointer}.answer-key{text-align:center;font-size:14px;color:#655480} .end-actions{display:flex;flex-direction:column;align-items:center;gap:15px;margin-top:20px}.end-actions .btn{display:inline-block;text-decoration:none;color:#fff;font-size:19px;padding:14px 30px}.end-actions .map-link{color:#654f9b;font-size:14px;text-decoration:underline}.end{padding:26px 12px}.end h2{font-size:29px}.end p{font-size:18px}</style></head><body><a class="back" href="grammar-planet-7.html">↩️ חזרה למסלול השאלות</a><main class="wrap"><h1>👾 QUESTION INVADERS</h1><p class="intro">משימת שאלות DO / DOES! הזיזו את זיגי וירו בחללית המתאימה לשאלה. 🚀</p><section class="panel" id="panel"><div class="stats"><span id="count">שאלה 1 מתוך 10</span><span id="stars">⭐ 0</span><span id="hearts">💜💜💜</span></div><div class="bar"><div id="bar"></div></div><div class="question" id="question" data-vocab></div><div class="game"><canvas id="c" width="640" height="390" aria-label="משחק חלליות DO DOES"></canvas></div><div class="controls"><button class="btn secondary" id="left">⬅️ שמאלה</button><button class="btn" id="fire">🚀 ירי</button><button class="btn secondary" id="right">ימינה ➡️</button></div><p class="hint">⌨️ חצים לתנועה · רווח לירי · בטלפון השתמשו בכפתורים</p><p class="message" id="msg">👽 פגעו בחללית עם התשובה הנכונה!</p></section><section class="panel end hidden" id="end"><h2>🏆 כל הכבוד!</h2><p>סיימתם 10 שאלות DO / DOES!</p><div class="end-actions"><a class="btn" href="grammar-planet-7-warmup.html?mode=negative">🚀 לשלב הבא</a><a class="map-link" href="level5.html">🪐 חזרה למפת הגלקסיה</a></div></section></main><script>
const pool=[{"subject":"I","aux":"do","action":"play soccer"},{"subject":"You","aux":"do","action":"visit the moon"},{"subject":"We","aux":"do","action":"help friends"},{"subject":"They","aux":"do","action":"drink milk"},{"subject":"He","aux":"does","action":"want a pet"},{"subject":"She","aux":"does","action":"have a robot"},{"subject":"It","aux":"does","action":"see the stars"},{"subject":"My brother","aux":"does","action":"eat pizza"},{"subject":"My friends","aux":"do","action":"ride bikes"},{"subject":"The astronaut","aux":"does","action":"watch TV"},{"subject":"The robots","aux":"do","action":"need help"},{"subject":"Our teacher","aux":"does","action":"read books"},{"subject":"My sister","aux":"does","action":"speak English"},{"subject":"The children","aux":"do","action":"like apples"},{"subject":"Tom and Maya","aux":"do","action":"draw stars"},{"subject":"I","aux":"do","action":"watch TV"},{"subject":"You","aux":"do","action":"need help"},{"subject":"We","aux":"do","action":"read books"},{"subject":"They","aux":"do","action":"speak English"},{"subject":"He","aux":"does","action":"like apples"},{"subject":"She","aux":"does","action":"draw stars"},{"subject":"It","aux":"does","action":"play soccer"},{"subject":"My brother","aux":"does","action":"visit the moon"},{"subject":"My friends","aux":"do","action":"help friends"},{"subject":"The astronaut","aux":"does","action":"drink milk"},{"subject":"The robots","aux":"do","action":"want a pet"},{"subject":"Our teacher","aux":"does","action":"have a robot"},{"subject":"My sister","aux":"does","action":"see the stars"},{"subject":"The children","aux":"do","action":"eat pizza"},{"subject":"Tom and Maya","aux":"do","action":"ride bikes"}],$=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let qs=[],idx=0,score=0,hearts=3,player=320,shots=[],ships=[],keys={},cooldown=0,paused=false,flash=0,roundId=0,anim=0,last=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function restart(){cancelAnimationFrame(anim);qs=shuffle(pool.slice()).slice(0,10);idx=0;score=0;hearts=3;$('panel').classList.remove('hidden');$('end').classList.add('hidden');startRound();last=0;anim=requestAnimationFrame(loop)}
function startRound(){roundId++;paused=false;shots=[];player=320;flash=0;const q=qs[idx];$('question').textContent='___ '+q.subject+' '+q.action+'?';$('count').textContent='👾 שאלה '+(idx+1)+' מתוך 10';$('stars').textContent='⭐ '+score;$('hearts').textContent='💜'.repeat(hearts);$('bar').style.width=idx*10+'%';$('msg').textContent='👽 ירו בחללית DO או DOES!';ships=[{label:'DO',x:145,y:90,v:1.15+score*.09},{label:'DOES',x:430,y:145,v:-1.1-score*.09}];}
function lose(){if(paused)return;hearts--;$('hearts').textContent='💜'.repeat(hearts);flash=24;shots=[];if(hearts<=0){paused=true;$('msg').textContent='💜 כל הכבוד על הניסיון! חוזרים עם 3 לבבות לאותה שאלה.';setTimeout(()=>{hearts=3;startRound()},1300)}else{$('msg').textContent='💫 כמעט! נסו שוב, אתם יכולים!';paused=true;setTimeout(()=>{paused=false;shots=[];player=320},750)}}
function hit(ship){if(paused)return;const correct=ship.label.toLowerCase()===qs[idx].aux;if(!correct){lose();return}paused=true;score++;$('stars').textContent='⭐ '+score;$('msg').textContent='🌟 נכון! '+ship.label+' '+qs[idx].subject+' '+qs[idx].action+'?';const id=roundId;setTimeout(()=>{if(id!==roundId)return;idx++;if(idx===10){$('panel').classList.add('hidden');$('end').classList.remove('hidden');try{localStorage.setItem('playwise_grammar_planet_7_invaders','completed')}catch(e){}paused=true}else startRound()},650)}
function fire(){if(paused||cooldown>0)return;shots.push({x:player,y:320});cooldown=17}
function drawAlien(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#eee7ff';ctx.fillRect(-15,8,30,25);ctx.fillStyle='#a8edb6';ctx.beginPath();ctx.ellipse(0,-3,22,19,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#14234a';ctx.beginPath();ctx.ellipse(-9,-5,6,9,-.3,0,7);ctx.ellipse(9,-5,6,9,.3,0,7);ctx.fill();ctx.fillStyle='#ffe8a1';ctx.fillRect(-3,-26,6,8);ctx.restore()}
function drawShip(s){ctx.save();ctx.translate(s.x,s.y);ctx.fillStyle='#8274dc';ctx.beginPath();ctx.ellipse(0,0,54,20,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5dd0de';ctx.beginPath();ctx.ellipse(0,-8,33,19,0,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.label,0,4);ctx.restore()}
function loop(t){let dt=Math.min((t-(last||t))/16.7,2);last=t;ctx.clearRect(0,0,640,390);ctx.fillStyle='#0c1740';ctx.fillRect(0,0,640,390);for(let j=0;j<42;j++){let x=(j*137+41)%640,y=(j*79+13)%390;ctx.fillStyle=j%3?'#e5eaff88':'#ffe8adbb';ctx.fillRect(x,y,2,2)}ctx.fillStyle='#1b3266';ctx.fillRect(0,350,640,40);if(!paused){if(keys.left)player=Math.max(30,player-6*dt);if(keys.right)player=Math.min(610,player+6*dt);if(keys.fire)fire();cooldown=Math.max(0,cooldown-dt);for(const s of ships){s.x+=s.v*dt;if(s.x>565||s.x<75)s.v*=-1}for(const shot of shots){shot.y-=9*dt;for(const s of ships){if(Math.abs(shot.x-s.x)<48&&Math.abs(shot.y-s.y)<19){shot.dead=true;hit(s);break}}}shots=shots.filter(a=>!a.dead&&a.y>-10)}for(const s of ships)drawShip(s);ctx.fillStyle='#ffdf81';for(const shot of shots){ctx.beginPath();ctx.arc(shot.x,shot.y,5,0,Math.PI*2);ctx.fill()}if(!(flash>0&&Math.floor(flash/4)%2)){drawAlien(player,315)}if(flash>0)flash--;anim=requestAnimationFrame(loop)}
for(const [id,key] of [['left','left'],['right','right'],['fire','fire']]){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;if(key==='fire')fire()});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[key]=false)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code)){e.preventDefault();keys[e.code==='ArrowLeft'?'left':e.code==='ArrowRight'?'right':'fire']=true;if(e.code==='Space')fire()}});document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))keys[e.code==='ArrowLeft'?'left':e.code==='ArrowRight'?'right':'fire']=false});window.addEventListener('blur',()=>keys={});restart();
</script><script src="grammar-vocabulary.js?v=2"></script><script src="grammar-stage-navigation.js?v=2"></script></body></html>
