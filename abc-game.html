
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק ABC</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f7f1ff}
.game{height:100dvh;width:100%;border:3px solid #8531d1;border-radius:18px;background:white;display:flex;flex-direction:column;padding:7px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0}
h1{margin:0;padding:6px 12px;text-align:center;font-size:clamp(14px,2.4vw,28px);color:#65129c;background:#eee0ff;border-radius:40px}
button{cursor:pointer;border:none}
.icon-button{background:#8529cb;color:white;border-radius:50%;width:40px;height:40px;font-size:23px;flex-shrink:0}
.instructions{text-align:center;color:#682094;font-weight:bold;font-size:clamp(12px,1.6vw,17px);margin:5px 0;flex-shrink:0}
.board{direction:ltr;flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));gap:clamp(3px,.65vmin,8px);width:min(100%,calc((100dvh - 125px)*1.15));max-width:1050px;margin:auto;padding:3px}
.slot,.letter{min-width:0;min-height:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;border:2px solid #7b3797;border-radius:18%;font-size:clamp(14px,3.4vmin,35px);font-weight:bold;user-select:none;-webkit-user-select:none}
.slot{background:#e6b4f2;color:#5c137e}
.slot.over{background:#c8ffce;outline:3px dashed #30a853}
.slot.filled{background:#d6f7d5;border-color:#42a64b}
.slot.star{background:#fff0ae;border-color:#d9a321}
.letter{background:#fff;color:#21132b;cursor:grab;touch-action:none;box-shadow:0 2px 5px #ddd}
.letter.selected{background:#ffe49d;border-color:#df9c00}
.letter.done{visibility:hidden;pointer-events:none}
.dragging{position:fixed;z-index:1000;pointer-events:none;opacity:.92;background:#fff1ae;box-shadow:0 4px 15px #999}
footer{text-align:center;flex-shrink:0;color:#6b249a;font-weight:bold;font-size:13px;padding:4px}
#message{color:#16832e}
@media(max-width:600px){.game{padding:3px;border-width:2px;border-radius:10px}.icon-button{width:31px;height:31px;font-size:18px}.board{width:100%;gap:2px}.slot,.letter{border-width:1.5px;font-size:clamp(13px,3.2vw,23px)}footer{font-size:11px}}
</style>
</head>

<body>

<div class="game">

  <header>
    <button class="icon-button"
      onclick="history.back()"
      title="חזרה">⌂</button>

    <h1>⭐ ABC – גררו את האותיות למקום הנכון ⭐</h1>

    <button class="icon-button"
      onclick="startGame()"
      title="משחק חדש">↻</button>
  </header>

  <div class="instructions">
    גררו את האותיות למשבצות לפי הסדר A עד Z
  </div>

  <main class="board" id="board" aria-label="לוח המשחק"></main>

  <footer>
    <span id="progress">0 מתוך 26 אותיות</span>
    <span id="message"></span>
  </footer>

</div>

<script>
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let placed=new Set(),selected=null,drag=null;
function shuffle(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cell(el,col,row){el.style.gridColumn=col;el.style.gridRow=row}
function startGame(){
 placed=new Set();selected=null;if(drag){drag.ghost.remove();drag=null}
 document.getElementById("message").textContent="";
 document.getElementById("progress").textContent="0 מתוך 26 אותיות";
 const board=document.getElementById("board");board.innerHTML="";
 // 28 cells: start star, A-Z, finish star. Seven columns, four rows.
 const sequence=["⭐",...alphabet,"🏆"];
 sequence.forEach((letter,i)=>{
  const slot=document.createElement("div");slot.className="slot"+(i===0||i===27?" star":"");
  if(i>0&&i<27){slot.dataset.letter=letter;slot.setAttribute("aria-label","מקום לאות "+letter)}
  else slot.textContent=letter;
  cell(slot,2+(i%7),3+Math.floor(i/7));board.appendChild(slot);
 });
 // Perimeter: 7 across top, 6 down right, 7 across bottom, 6 up left.
 const positions=[];
 for(let col=2;col<=8;col++)positions.push([col,1]);
 for(let row=2;row<=7;row++)positions.push([9,row]);
 for(let col=8;col>=2;col--)positions.push([col,8]);
 for(let row=7;row>=2;row--)positions.push([1,row]);
 shuffle(alphabet).forEach((letter,i)=>{
  const tile=document.createElement("div");tile.className="letter";tile.textContent=letter;tile.dataset.letter=letter;
  tile.setAttribute("role","button");tile.setAttribute("tabindex","0");tile.setAttribute("aria-label","אות "+letter);
  cell(tile,...positions[i]);tile.addEventListener("pointerdown",pointerDown);
  tile.addEventListener("click",()=>chooseLetter(tile));
  tile.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chooseLetter(tile)}});
  board.appendChild(tile);
 });
}
function chooseLetter(tile){if(placed.has(tile.dataset.letter))return;document.querySelectorAll(".letter").forEach(e=>e.classList.remove("selected"));selected=tile.dataset.letter;tile.classList.add("selected")}
function placeLetter(letter,slot){
 if(!slot||!slot.classList.contains("slot")||!slot.dataset.letter||placed.has(letter))return;
 if(slot.dataset.letter!==letter){slot.style.background="#ffd0d0";setTimeout(()=>{if(!slot.classList.contains("filled"))slot.style.background=""},350);return}
 slot.textContent=letter;slot.classList.add("filled");slot.style.background="";
 placed.add(letter);const tile=[...document.querySelectorAll(".letter")].find(e=>e.dataset.letter===letter);
 if(tile)tile.classList.add("done");selected=null;
 document.getElementById("progress").textContent=placed.size+" מתוך 26 אותיות";
 if(placed.size===26)document.getElementById("message").textContent=" 🎉 כל הכבוד! השלמתם את האלפבית! ⭐";
}
function pointerDown(event){
 if(event.pointerType==="mouse"&&event.button!==0)return;
 const tile=event.currentTarget,letter=tile.dataset.letter;if(placed.has(letter))return;
 event.preventDefault();const rect=tile.getBoundingClientRect(),ghost=tile.cloneNode(true);
 ghost.classList.add("dragging");ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";
 ghost.style.left=(event.clientX-rect.width/2)+"px";ghost.style.top=(event.clientY-rect.height/2)+"px";
 document.body.appendChild(ghost);drag={letter,ghost,pointerId:event.pointerId,original:tile};
 tile.setPointerCapture(event.pointerId);
}
document.addEventListener("pointermove",event=>{
 if(!drag||drag.pointerId!==event.pointerId)return;
 const ghost=drag.ghost;ghost.style.left=(event.clientX-ghost.offsetWidth/2)+"px";ghost.style.top=(event.clientY-ghost.offsetHeight/2)+"px";
 document.querySelectorAll(".slot").forEach(e=>e.classList.remove("over"));
 const target=document.elementFromPoint(event.clientX,event.clientY),slot=target&&target.closest(".slot");
 if(slot&&slot.dataset.letter)slot.classList.add("over");
});
document.addEventListener("pointerup",event=>{
 if(!drag||drag.pointerId!==event.pointerId)return;
 const {letter,ghost,original}=drag;ghost.remove();
 const target=document.elementFromPoint(event.clientX,event.clientY),slot=target&&target.closest(".slot");
 document.querySelectorAll(".slot").forEach(e=>e.classList.remove("over"));
 if(slot)placeLetter(letter,slot);
 else if(!placed.has(letter))chooseLetter(original);
 drag=null;
});
document.addEventListener("pointercancel",()=>{if(drag){drag.ghost.remove();drag=null}});
document.getElementById("board").addEventListener("click",event=>{const slot=event.target.closest(".slot");if(slot&&selected)placeLetter(selected,slot)});
startGame();
</script>

</body>
</html>
