
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק ABC</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f7f1ff;
}

.game {
  height: 100dvh;
  width: 100%;
  border: 4px solid #8531d1;
  border-radius: 22px;
  background: white;
  display: flex;
  flex-direction: column;
  padding: 8px;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}

h1 {
  margin: 0;
  padding: 8px 12px;
  text-align: center;
  font-size: clamp(15px, 2.6vw, 30px);
  color: #65129c;
  background: #eee0ff;
  border-radius: 40px;
}

button {
  cursor: pointer;
  border: none;
}

.icon-button {
  background: #8529cb;
  color: white;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  font-size: 23px;
  flex-shrink: 0;
}

.instructions {
  text-align: center;
  color: #682094;
  font-weight: bold;
  font-size: clamp(12px, 1.7vw, 17px);
  margin: 6px 0;
  flex-shrink: 0;
}

.board {
  direction: ltr;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-rows: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr);
  gap: 5px;
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

.letters {
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  gap: 3px;
  min-height: 0;
}

.middle {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 4fr) minmax(0, 1fr);
  gap: 5px;
  min-height: 0;
}

.side {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 4px;
  place-items: center;
  min-height: 0;
}

.slots {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: clamp(3px, 0.7vw, 10px);
  padding: 4px;
  min-height: 0;
}

.slot {
  background: #e6b4f2;
  border: 2px solid #7b3797;
  border-radius: 20%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: clamp(11px, 2vw, 25px);
  font-weight: bold;
  color: #5c137e;
  min-width: 0;
  min-height: 0;
  position: relative;
}

.slot.over {
  background: #c8ffce;
  outline: 3px dashed #30a853;
}

.slot.filled {
  background: #d6f7d5;
  border-color: #42a64b;
}

.slot.star {
  background: #fff0ae;
  border-color: #d9a321;
  font-size: clamp(16px, 2.4vw, 30px);
}

.letter {
  width: min(100%, 48px);
  aspect-ratio: 1;
  max-height: 100%;
  border-radius: 50%;
  border: 2px solid #793c99;
  background: white;
  color: #151515;
  font-size: clamp(12px, 2vw, 24px);
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.letter.selected {
  background: #ffe49d;
  border-color: #df9c00;
}

.letter.done {
  visibility: hidden;
  pointer-events: none;
}

.dragging {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  opacity: 0.9;
  background: #fff1ae;
  box-shadow: 0 4px 15px #999;
}

footer {
  text-align: center;
  flex-shrink: 0;
  color: #6b249a;
  font-weight: bold;
  font-size: 13px;
  padding: 4px;
}

#message {
  color: #16832e;
}

@media (max-width: 600px) {
  .game {
    padding: 4px;
    border-width: 2px;
    border-radius: 12px;
  }

  .icon-button {
    width: 32px;
    height: 32px;
    font-size: 18px;
  }

  .board {
    grid-template-rows: minmax(0, 1fr) minmax(0, 4fr) minmax(0, 1fr);
  }

  .middle {
    grid-template-columns: minmax(0, 1fr) minmax(0, 5fr) minmax(0, 1fr);
    gap: 2px;
  }

  .side {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(8, minmax(0, 1fr));
    gap: 2px;
  }

  .letter {
    border-width: 1.5px;
    font-size: clamp(9px, 2.7vw, 16px);
  }

  .slot {
    border-width: 1.5px;
    font-size: clamp(9px, 2.8vw, 16px);
  }

  .slots {
    gap: 3px;
    padding: 1px;
  }

  footer {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<div class="game">

  <header>
    <button class="icon-button"
      onclick="history.back()"
      title="חזרה">⌂</button>

    <h1>⭐ ABC – גררו את האותיות למקום הנכון ⭐</h1>

    <button class="icon-button"
      onclick="startGame()"
      title="משחק חדש">↻</button>
  </header>

  <div class="instructions">
    גררו את האותיות למשבצות לפי הסדר A עד Z
  </div>

  <main class="board">
    <div class="letters" id="topLetters"></div>

    <div class="middle">
      <div class="side" id="leftLetters"></div>
      <div class="slots" id="slots"></div>
      <div class="side" id="rightLetters"></div>
    </div>

    <div class="letters" id="bottomLetters"></div>
  </main>

  <footer>
    <span id="progress">0 מתוך 26 אותיות</span>
    <span id="message"></span>
  </footer>

</div>

<script>
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

let placed = new Set();
let selected = null;
let drag = null;

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function startGame() {
  placed = new Set();
  selected = null;
  drag = null;

  document.getElementById("message").textContent = "";
  document.getElementById("progress").textContent =
    "0 מתוך 26 אותיות";

  const slots = document.getElementById("slots");
  slots.innerHTML = "";

  // כוכב בתחילת המסלול
  const startStar = document.createElement("div");
  startStar.className = "slot star";
  startStar.textContent = "⭐";
  slots.appendChild(startStar);

  // 26 משבצות לפי סדר האלפבית
  alphabet.forEach(letter => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.letter = letter;
    slot.setAttribute("aria-label", "מקום לאות " + letter);
    slots.appendChild(slot);
  });

  // כוכב בסיום המסלול
  const endStar = document.createElement("div");
  endStar.className = "slot star";
  endStar.textContent = "🏆";
  slots.appendChild(endStar);

  const shuffled = shuffle(alphabet);

  const groups = {
    topLetters: shuffled.slice(0, 5),
    rightLetters: shuffled.slice(5, 13),
    bottomLetters: shuffled.slice(13, 18),
    leftLetters: shuffled.slice(18, 26)
  };

  Object.entries(groups).forEach(([id, letters]) => {
    const container = document.getElementById(id);
    container.innerHTML = "";

    letters.forEach(letter => {
      const circle = document.createElement("div");
      circle.className = "letter";
      circle.textContent = letter;
      circle.dataset.letter = letter;

      circle.addEventListener("pointerdown", pointerDown);
      circle.addEventListener("click", () => chooseLetter(circle));

      container.appendChild(circle);
    });
  });
}

function chooseLetter(circle) {
  if (placed.has(circle.dataset.letter)) return;

  document.querySelectorAll(".letter").forEach(el => {
    el.classList.remove("selected");
  });

  selected = circle.dataset.letter;
  circle.classList.add("selected");
}

function placeLetter(letter, slot) {
  if (!slot || !slot.classList.contains("slot")) return;
  if (!slot.dataset.letter) return;
  if (placed.has(letter)) return;

  if (slot.dataset.letter !== letter) {
    slot.style.background = "#ffd0d0";

    setTimeout(() => {
      if (!slot.classList.contains("filled")) {
        slot.style.background = "";
      }
    }, 350);

    return;
  }

  slot.textContent = letter;
  slot.classList.add("filled");
  slot.style.background = "";

  placed.add(letter);

  const circle = [...document.querySelectorAll(".letter")]
    .find(el => el.dataset.letter === letter);

  if (circle) circle.classList.add("done");

  selected = null;

  document.getElementById("progress").textContent =
    placed.size + " מתוך 26 אותיות";

  if (placed.size === 26) {
    document.getElementById("message").textContent =
      " 🎉 כל הכבוד! השלמתם את האלפבית! ⭐";
  }
}

function pointerDown(event) {
  if (event.button !== 0 && event.pointerType === "mouse") return;

  const original = event.currentTarget;
  const letter = original.dataset.letter;

  if (placed.has(letter)) return;

  event.preventDefault();

  const rect = original.getBoundingClientRect();

  const ghost = original.cloneNode(true);
  ghost.classList.add("dragging");

  ghost.style.width = rect.width + "px";
  ghost.style.height = rect.height + "px";
  ghost.style.left = (event.clientX - rect.width / 2) + "px";
  ghost.style.top = (event.clientY - rect.height / 2) + "px";

  document.body.appendChild(ghost);

  drag = {
    letter,
    ghost,
    pointerId: event.pointerId,
    original
  };

  original.setPointerCapture(event.pointerId);
}

document.addEventListener("pointermove", event => {
  if (!drag || drag.pointerId !== event.pointerId) return;

  const ghost = drag.ghost;

  ghost.style.left =
    (event.clientX - ghost.offsetWidth / 2) + "px";

  ghost.style.top =
    (event.clientY - ghost.offsetHeight / 2) + "px";

  document.querySelectorAll(".slot").forEach(slot => {
    slot.classList.remove("over");
  });

  const target = document.elementFromPoint(
    event.clientX,
    event.clientY
  );

  const slot = target && target.closest(".slot");

  if (slot && slot.dataset.letter) {
    slot.classList.add("over");
  }
});

document.addEventListener("pointerup", event => {
  if (!drag || drag.pointerId !== event.pointerId) return;

  const letter = drag.letter;

  drag.ghost.remove();

  const target = document.elementFromPoint(
    event.clientX,
    event.clientY
  );

  const slot = target && target.closest(".slot");

  document.querySelectorAll(".slot").forEach(el => {
    el.classList.remove("over");
  });

  if (slot) {
    placeLetter(letter, slot);
  }

  drag = null;
});

document.addEventListener("pointercancel", () => {
  if (drag) {
    drag.ghost.remove();
    drag = null;
  }
});

// אפשר גם ללחוץ על אות ואז על המשבצת
document.getElementById("slots").addEventListener("click", event => {
  const slot = event.target.closest(".slot");

  if (slot && selected) {
    placeLetter(selected, slot);
  }
});

startGame();
</script>

</body>
</html>
