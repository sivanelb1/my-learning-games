
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק ABC</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f7f1ff}
.game{height:100dvh;width:100%;border:3px solid #8531d1;border-radius:18px;background:white;display:flex;flex-direction:column;padding:7px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-shrink:0}
h1{margin:0;padding:6px 12px;text-align:center;font-size:clamp(14px,2.4vw,28px);color:#65129c;background:#eee0ff;border-radius:40px}
button{cursor:pointer;border:none}
.icon-button{background:#8529cb;color:white;border-radius:50%;width:40px;height:40px;font-size:23px;flex-shrink:0}
.instructions{text-align:center;color:#682094;font-weight:bold;font-size:clamp(12px,1.6vw,17px);margin:5px 0;flex-shrink:0}
.board{direction:ltr;flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:clamp(3px,.65vmin,8px);width:100%;max-width:none;margin:auto;padding:3px}
.slot,.letter{min-width:0;min-height:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;border:2px solid #7b3797;border-radius:18%;font-size:clamp(17px,4.5vmin,45px);font-weight:bold;user-select:none;-webkit-user-select:none}
.slot{background:#e6b4f2;color:#5c137e}
.slot.over{background:#c8ffce;outline:3px dashed #30a853}
.slot.filled{background:#d6f7d5;border-color:#42a64b;cursor:pointer;position:relative}
.slot.filled::after{content:"🔊";position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:clamp(15px,2.8vmin,25px);line-height:1;filter:drop-shadow(0 1px 1px #ffffffaa)}
.slot.filled:focus-visible{outline:3px solid #e6a700}
.slot.filled{padding-right:clamp(19px,3vmin,30px);direction:ltr;gap:2px}
.slot.star{background:#fff0ae;border-color:#d9a321}
.slot.start{border:3px solid #ffc400;box-shadow:0 0 12px 3px #ffdc54,inset 0 0 8px #fff3a3;animation:startGlow 1.5s ease-in-out infinite alternate}
@keyframes startGlow{to{box-shadow:0 0 18px 5px #ffbd00,inset 0 0 10px #fff2a1}}
.slot.error{background:#ffd0d0!important;border-color:#e34c65!important}
.letter{background:#fff;color:#21132b;cursor:grab;touch-action:none;box-shadow:0 2px 5px #ddd}
.letter.selected{background:#ffe49d;border-color:#df9c00}
.letter.done{visibility:hidden;pointer-events:none}
.letter.lowercase{background:#ffe1a3;border-color:#e18417;color:#763600}
.slot.matching{background:#d6f7d5;border-color:#42a64b}
.slot.matched{background:#c7f5dc;border-color:#31a565}
.slot.matched::before{content:attr(data-small);position:static;order:1;font-size:clamp(15px,3.1vmin,30px);color:#c05a00;font-weight:900}
.slot.matched::after{content:"🔊";position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:clamp(15px,2.8vmin,25px)}

.dragging{position:fixed;z-index:1000;pointer-events:none;opacity:.92;background:#fff1ae;box-shadow:0 4px 15px #999}
.success-overlay{position:fixed;inset:0;background:#1d0c3bc9;display:grid;place-items:center;z-index:1100;padding:18px}.success-overlay[hidden]{display:none}.success-card{width:min(460px,96vw);background:white;border:5px solid #b47bed;border-radius:28px;padding:30px 20px;text-align:center;color:#562184;box-shadow:0 10px 35px #16052a}.success-card h2{font-size:clamp(25px,5vw,38px)}.success-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.success-actions a{background:#7833c5;color:white;padding:14px 17px;border-radius:15px;text-decoration:none;font-weight:bold}.success-actions a:last-child{background:#ffcf42;color:#341550}footer{text-align:center;flex-shrink:0;color:#6b249a;font-weight:bold;font-size:13px;padding:4px}
#message{color:#16832e}
@media(max-width:600px){.game{padding:3px;border-width:2px;border-radius:10px}.icon-button{width:31px;height:31px;font-size:18px}.board{width:100%;gap:2px}.slot,.letter{border-width:1.5px;font-size:clamp(13px,3.2vw,23px)}footer{font-size:11px}}
</style>
</head>

<body>

<div class="game">

  <header>
    <button class="icon-button"
      onclick="history.back()"
      title="חזרה">⌂</button>

    <h1>⭐ ABC – גררו את האותיות למקום הנכון ⭐</h1>

    <button class="icon-button"
      onclick="startGame()"
      title="משחק חדש">↻</button>
  </header>

  <div class="instructions">
    גררו את האותיות למשבצות לפי הסדר A עד Z
  </div>

  <main class="board" id="board" aria-label="לוח המשחק"></main>

  <footer>
    <span id="progress">0 מתוך 26 אותיות</span>
    <span id="message"></span>
  </footer>

</div>
<div class="success-overlay" id="success" hidden><div class="success-card"><h2>🏆 כל הכבוד!</h2><p>השלמתם את המשימה בהצלחה! 🎉</p><div class="success-actions"><a href="level1.html">🗺️ חזרה למפה</a><a href="sounds-game.html">🚀 מעבר לשלב הבא</a></div></div></div>

<script>
const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let placed=new Set(),selected=null,drag=null,phase="upper",matched=new Set();
function shuffle(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cell(el,col,row){el.style.gridColumn=col;el.style.gridRow=row}
function startGame(){
 placed=new Set();matched=new Set();phase="upper";selected=null;if(drag){drag.ghost.remove();drag=null}
 document.getElementById("success").hidden=true;
 document.getElementById("message").textContent="";
 document.querySelector(".instructions").textContent="גררו את האותיות הגדולות למשבצות לפי הסדר A עד Z";
 document.getElementById("progress").textContent="0 מתוך 26 אותיות";
 const board=document.getElementById("board");board.innerHTML="";
 // 27 cells: A-Z followed by trophy. A is highlighted as the start.
 const sequence=[...alphabet,"🏆"];
 sequence.forEach((letter,i)=>{
  const slot=document.createElement("div");slot.className="slot"+(i===0?" start":i===26?" star":"");
  if(i<26){slot.dataset.letter=letter;slot.setAttribute("aria-label","מקום לאות "+letter);slot.addEventListener("click",()=>{if(phase==="upper"&&placed.has(letter)||phase==="lower"&&matched.has(letter))sayLetterName(letter)});slot.addEventListener("keydown",e=>{if(placed.has(letter)&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sayLetterName(letter)}})}
  else slot.textContent=letter;
  cell(slot,2+(i%9),2+Math.floor(i/9));board.appendChild(slot);
 });
 makeTiles(alphabet,false);
}
function makeTiles(letters,lowercase){
 const board=document.getElementById("board");
 const positions=[];
 for(let col=2;col<=10;col++)positions.push([col,1]);
 for(let row=2;row<=6;row++)positions.push([11,row]);
 for(let col=10;col>=2;col--)positions.push([col,7]);
 for(let row=6;row>=4;row--)positions.push([1,row]);
 shuffle(letters).forEach((letter,i)=>{
  const tile=document.createElement("div");tile.className="letter"+(lowercase?" lowercase":"");tile.textContent=letter;tile.dataset.letter=letter;
  tile.setAttribute("role","button");tile.setAttribute("tabindex","0");tile.setAttribute("aria-label","אות "+letter);
  cell(tile,...positions[i]);tile.addEventListener("pointerdown",pointerDown);
  tile.addEventListener("click",()=>chooseLetter(tile));
  tile.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();chooseLetter(tile)}});
  board.appendChild(tile);
 });
}
function sayLetterName(letter){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(letter);u.lang="en-US";u.rate=.8;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==="en-US")||voices.find(v=>v.lang.startsWith("en"));if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function chooseLetter(tile){if(tile.classList.contains("done"))return;document.querySelectorAll(".letter").forEach(e=>e.classList.remove("selected"));selected=tile.dataset.letter;tile.classList.add("selected")}
function placeLetter(letter,slot){
 if(!slot||!slot.classList.contains("slot")||!slot.dataset.letter)return;
 if(phase==="upper"&&placed.has(letter)||phase==="lower"&&matched.has(letter.toUpperCase()))return;
 if(slot.dataset.letter!==(phase==="lower"?letter.toUpperCase():letter)){slot.classList.add("error");setTimeout(()=>slot.classList.remove("error"),450);return}
 if(phase==="lower"){
  const upper=letter.toUpperCase();matched.add(upper);slot.dataset.small=letter;slot.classList.remove("error");slot.classList.add("matched");
  const lowerTile=[...document.querySelectorAll(".letter")].find(e=>e.dataset.letter===letter);if(lowerTile)lowerTile.classList.add("done");selected=null;
  document.getElementById("progress").textContent=matched.size+" מתוך 26 זוגות";
  document.getElementById("message").textContent=matched.size===26?"🎉 כל הכבוד! התאמתם את כל האותיות!":"🔊 לחצו על האות הירוקה לשמיעת שמה";
  if(matched.size===26){document.getElementById("success").hidden=false;window.PlaywiseTreasure?.award(1)}
  return;
 }
 slot.textContent=letter;slot.classList.remove("error");slot.classList.add("filled");slot.style.background="";slot.setAttribute("role","button");slot.setAttribute("tabindex","0");slot.setAttribute("title","🔊 לחצו לשמיעת שם האות "+letter);slot.setAttribute("aria-label","השמעת שם האות "+letter);
 placed.add(letter);const tile=[...document.querySelectorAll(".letter")].find(e=>e.dataset.letter===letter);
 if(tile)tile.classList.add("done");selected=null;
 document.getElementById("progress").textContent=placed.size+" מתוך 26 אותיות";
 document.getElementById("message").textContent=" 🔊 לחצו על האות הירוקה כדי לשמוע את שמה";
 if(placed.size===26){
  phase="lower";selected=null;
  document.querySelectorAll(".letter").forEach(e=>e.remove());
  document.querySelectorAll(".slot.filled").forEach(e=>e.classList.add("matching"));
  document.querySelector(".instructions").textContent="עכשיו התאימו כל אות קטנה בצבע כתום לאות הגדולה שלה!";
  document.getElementById("progress").textContent="0 מתוך 26 זוגות";
  document.getElementById("message").textContent="🎉 מצוין! מתחילים להתאים אותיות קטנות";
  makeTiles(alphabet.map(x=>x.toLowerCase()),true);
 }
}
function pointerDown(event){
 if(event.pointerType==="mouse"&&event.button!==0)return;
 const tile=event.currentTarget,letter=tile.dataset.letter;if(tile.classList.contains("done"))return;
 event.preventDefault();const rect=tile.getBoundingClientRect(),ghost=tile.cloneNode(true);
 ghost.classList.add("dragging");ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";
 ghost.style.left=(event.clientX-rect.width/2)+"px";ghost.style.top=(event.clientY-rect.height/2)+"px";
 document.body.appendChild(ghost);drag={letter,ghost,pointerId:event.pointerId,original:tile};
 tile.setPointerCapture(event.pointerId);
}
document.addEventListener("pointermove",event=>{
 if(!drag||drag.pointerId!==event.pointerId)return;
 const ghost=drag.ghost;ghost.style.left=(event.clientX-ghost.offsetWidth/2)+"px";ghost.style.top=(event.clientY-ghost.offsetHeight/2)+"px";
 document.querySelectorAll(".slot").forEach(e=>e.classList.remove("over"));
 const target=document.elementFromPoint(event.clientX,event.clientY),slot=target&&target.closest(".slot");
 if(slot&&slot.dataset.letter)slot.classList.add("over");
});
document.addEventListener("pointerup",event=>{
 if(!drag||drag.pointerId!==event.pointerId)return;
 const {letter,ghost,original}=drag;ghost.remove();
 const target=document.elementFromPoint(event.clientX,event.clientY),slot=target&&target.closest(".slot");
 document.querySelectorAll(".slot").forEach(e=>e.classList.remove("over"));
 if(slot)placeLetter(letter,slot);
 else if(!placed.has(letter))chooseLetter(original);
 drag=null;
});
document.addEventListener("pointercancel",()=>{if(drag){drag.ghost.remove();drag=null}});
document.getElementById("board").addEventListener("click",event=>{const slot=event.target.closest(".slot");if(slot&&selected)placeLetter(selected,slot)});
startGame();
</script>

<script src="treasure-progress.js?v=map-final-3"></script></body>
</html>
