*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 15%,#33336f,transparent 45%),radial-gradient(ellipse at 90% 80%,#12527a,transparent 50%),#080e28;color:#fff;font-family:Arial,sans-serif}a{color:#fff}.back{display:inline-block;margin:16px;padding:12px 17px;background:#342b65;border-radius:14px;text-decoration:none}main{max-width:1050px;margin:auto;padding:0 15px 45px}header{text-align:center}h1{font-size:clamp(28px,5vw,48px);color:#ffe6a5;margin:8px}header p{line-height:1.6}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffffff16;padding:12px 18px;border-radius:15px;margin:15px 0}.track{height:10px;background:#ffffff33;border-radius:20px;overflow:hidden;margin-bottom:15px}.fill{height:100%;width:0;background:linear-gradient(90deg,#60d4dd,#ffd479);transition:width .4s}.question{text-align:center;background:#ffffff18;border:1px solid #ffffff33;padding:15px;border-radius:20px}.question small{display:block;font-size:16px}.word{font-size:clamp(36px,7vw,62px);font-weight:900;direction:ltr;letter-spacing:2px;color:#ffeb9e}.universe{height:clamp(390px,55vw,520px);position:relative;overflow:hidden;border-radius:25px;background:radial-gradient(circle at 50% 85%,#39416e,transparent 45%),linear-gradient(#0c173e,#080f29);margin:15px 0;border:2px solid #7883bb55}.stars{position:absolute;inset:0;opacity:.7;background-image:radial-gradient(white 1px,transparent 2px),radial-gradient(#b6dcff 1px,transparent 2px);background-size:47px 57px,79px 89px;background-position:7px 13px,27px 43px;pointer-events:none}.planet-choice{position:absolute;top:13%;width:29%;height:48%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:transparent;color:white;cursor:pointer;transition:transform .2s;z-index:2}.planet-choice:hover,.planet-choice:focus-visible{transform:translateY(-9px) scale(1.04);outline:none}.planet-choice:focus-visible .orb{outline:3px solid #fff}.planet-choice:nth-of-type(1){left:2%}.planet-choice:nth-of-type(2){left:35.5%}.planet-choice:nth-of-type(3){left:69%}.orb{width:clamp(75px,12vw,125px);height:clamp(75px,12vw,125px);border-radius:50%;position:relative;box-shadow:inset -18px -12px 20px #0a143988,inset 9px 9px 20px #ffffff77,0 0 30px var(--glow);background:radial-gradient(circle at 32% 28%,#ffffff9c,transparent 28%),repeating-linear-gradient(165deg,transparent 0 20px,#ffffff20 23px 29px,transparent 35px 50px),var(--glow);animation:float 3s ease-in-out infinite}.planet-choice:nth-of-type(2) .orb{animation-delay:-1s}.planet-choice:nth-of-type(3) .orb{animation-delay:-2s}.planet-name{margin:12px 0 8px;font-size:clamp(14px,2vw,19px);font-weight:bold}.answer{font-size:clamp(14px,2.5vw,23px);background:#ffffffee;color:#2c2752;padding:9px 12px;border-radius:13px;font-weight:900;direction:ltr;box-shadow:0 3px 12px #0006;max-width:100%;overflow-wrap:anywhere}.ship{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-size:clamp(50px,8vw,80px);z-index:4;filter:drop-shadow(0 0 13px #6df1ff);transition:left .65s ease-in,top .65s ease-in,transform .65s ease-in,opacity .3s}.ship.fly{left:var(--tx);top:var(--ty);bottom:auto;transform:translate(-50%,-50%) scale(.12) rotate(-18deg);opacity:0}.beam{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--tx) var(--ty),#ffffff, #9cd5ff88 13%,transparent 48%)}.beam.on{animation:flash 1.5s ease-in-out forwards}.hint{text-align:center;font-size:17px;color:#e4dafa}.feedback{text-align:center;min-height:30px;color:#ffe6a5}.overlay{position:fixed;inset:0;background:#060b24dc;display:grid;place-items:center;padding:15px;z-index:20}.hidden{display:none!important}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fefaff;color:#32264f;border:4px solid #b5a1ef;border-radius:25px;padding:22px;text-align:center;box-shadow:0 18px 80px #000b}.modal h2{font-size:clamp(24px,5vw,35px);margin:7px 0}.modal p{font-size:19px;line-height:1.7}.discovery{background:#e7f5ff;border-radius:18px;padding:14px}.discovery .bigplanet{font-size:64px;display:block}.discovery h3{margin:5px;font-size:23px}.grammar{background:#f1e9ff;border-radius:14px;padding:12px}.btn{border:0;border-radius:14px;background:#7252bc;color:white;font-size:19px;font-weight:bold;padding:13px 20px;cursor:pointer}.btn:hover{background:#5a3da5}.travel{position:fixed;inset:0;z-index:12;background:radial-gradient(circle,#7ac7ff,#252b83 40%,#090e2c 80%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none;animation:warp 1.65s ease-in-out forwards}.travel .rocket{font-size:100px;animation:zoom 1.5s ease-in forwards}.travel h2{font-size:30px}@keyframes float{50%{transform:translateY(-9px)}}@keyframes flash{35%{opacity:1}100%{opacity:0}}@keyframes zoom{to{transform:scale(3) rotate(-10deg);opacity:0}}@keyframes warp{0%{opacity:0}20%,75%{opacity:1}100%{opacity:0}}@media(max-width:520px){.universe{height:410px}.planet-choice{top:12%;height:52%}.orb{width:80px;height:80px}.answer{padding:7px 5px}.planet-name{font-size:14px}.status{font-size:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><a class="back" href="grammar-planet-5.html">☄️ חזרה לשביט היחיד והרבים</a><main><header><div style="font-size:46px">👽🚀🪐</div><h1>המסע בין כוכבי הלכת</h1><p>אתגר 2 · בחרו את כוכב הלכת עם צורת הרבים הנכונה, השתגרו אליו וגלו סוד אמיתי מהחלל!</p></header><div class="status"><strong id="count">מסע 1 מתוך 10</strong><strong id="score">⭐ 0 כוכבים</strong></div><div class="track"><div class="fill" id="fill"></div></div><div class="question"><small>👽 זיגי שואל: איך אומרים את המילה הזאת ברבים?</small><div class="word" id="word"></div></div><div class="universe" id="universe"><div class="stars"></div><div id="planets"></div><div class="ship" id="ship">🚀</div><div class="beam" id="beam"></div></div><p class="hint">🪐 לחצו על כוכב הלכת עם התשובה הנכונה כדי לשגר את החללית!</p><p class="feedback" id="feedback" aria-live="polite"></p></main><div class="overlay hidden" id="overlay"><div class="modal"><h2 id="modalTitle">🌟 כל הכבוד!</h2><div class="grammar" id="grammar"></div><div class="discovery"><span class="bigplanet" id="planetEmoji">🪐</span><h3 id="planetTitle"></h3><p id="fact"></p></div><p><button class="btn" id="next" onclick="next()">🚀 ממשיכים למסע הבא</button></p></div></div><script>
const questions=[["fox",["foxs","foxes","foxies"],1,"FOX מסתיימת ב־X, אחת האותיות השורקות, ולכן מוסיפים ES."],["cherry",["cherrys","cherries","cherryes"],1,"לפני Y במילה CHERRY יש R, שאינה אות ניקוד. מחליפים Y ב־IES."],["brush",["brushes","brushs","brushies"],0,"BRUSH מסתיימת ב־SH, סיומת שורקת, ולכן מוסיפים ES."],["key",["keies","keys","keyes"],1,"לפני Y במילה KEY יש E, אות ניקוד, ולכן מוסיפים רק S."],["class",["classs","classies","classes"],2,"CLASS מסתיימת ב־SS, ולכן מוסיפים ES."],["story",["storys","stories","storyes"],1,"לפני Y במילה STORY יש R, ולכן מחליפים Y ב־IES."],["bench",["benches","benchs","benchies"],0,"BENCH מסתיימת ב־CH, סיומת שורקת, ולכן מוסיפים ES."],["monkey",["monkies","monkeys","monkeyes"],1,"לפני Y במילה MONKEY יש E, אות ניקוד, ולכן מוסיפים S."],["quiz",["quizs","quizes","quizzes"],2,"QUIZ מסתיימת ב־Z. בצורת הרבים מכפילים את Z ומוסיפים ES: quizzes."],["church",["churchs","churches","churchies"],1,"CHURCH מסתיימת ב־CH, סיומת שורקת, ולכן מוסיפים ES."]];
const destinations=[["נפטון","Neptune","#2679e5","בנפטון נושבות הרוחות המהירות ביותר שנמדדו במערכת השמש."],["מאדים","Mars","#dc6848","במאדים נמצא אולימפוס מונס, הר הגעש הגדול ביותר המוכר במערכת השמש."],["שבתאי","Saturn","#e4b46b","הטבעות של שבתאי עשויות בעיקר מחלקיקי קרח, לצד סלע ואבק."],["צדק","Jupiter","#d89b70","הכתם האדום הגדול של צדק הוא סערה ענקית שנמשכת כבר מאות שנים."],["נוגה","Venus","#f3c57d","נוגה הוא כוכב הלכת החם ביותר במערכת השמש, אף שכוכב חמה קרוב יותר לשמש."],["אורנוס","Uranus","#7dd9d8","אורנוס מסתובב כמעט על צדו, בשונה מרוב כוכבי הלכת."],["כדור הארץ","Earth","#45b8a6","כדור הארץ הוא כוכב הלכת היחיד שאנחנו יודעים בוודאות שיש עליו חיים."],["כוכב חמה","Mercury","#aeb4c4","כוכב חמה הוא כוכב הלכת הקטן ביותר במערכת השמש."],["נפטון","Neptune","#2679e5","נפטון רחוק כל כך מהשמש, ששנה אחת בו נמשכת כ־165 שנות ארץ."],["שבתאי","Saturn","#e4b46b","שבתאי צפוף פחות ממים: הצפיפות הממוצעת שלו נמוכה מזו של מים."]];
const $=id=>document.getElementById(id);
let index=0,score=0,busy=false,arrival=null;
const icons={'נפטון':'🔵','מאדים':'🔴','שבתאי':'🪐','צדק':'🟠','נוגה':'🟡','אורנוס':'🩵','כדור הארץ':'🌍','כוכב חמה':'🌑'};
function render(){busy=false;arrival=null;$('overlay').classList.add('hidden');$('ship').classList.remove('fly');$('beam').classList.remove('on');$('ship').removeAttribute('style');$('beam').removeAttribute('style');$('count').textContent='מסע '+(index+1)+' מתוך '+questions.length;$('score').textContent='⭐ '+score+' כוכבים';$('fill').style.width=(index/questions.length*100)+'%';$('word').textContent=questions[index][0].toUpperCase()+' → ?';$('feedback').textContent='';const q=questions[index];const order=[index%8,(index+3)%8,(index+5)%8];const correctSlot=(index*2+1)%3;const choices=q[1].slice();const right=choices[q[2]];const arranged=[...choices.filter((_,i)=>i!==q[2])];arranged.splice(correctSlot,0,right);$('planets').innerHTML='';arranged.forEach((answer,slot)=>{const p=destinations[order[slot]];const b=document.createElement('button');b.className='planet-choice';b.setAttribute('aria-label',p[0]+', '+answer);b.innerHTML='<span class="orb" style="--glow:'+p[2]+'"></span><span class="planet-name">'+p[0]+'</span><span class="answer">'+answer.toUpperCase()+'</span>';b.onclick=()=>choose(answer===right,slot,p);$('planets').appendChild(b)})}
function choose(correct,slot,p){if(busy)return;if(!correct){$('feedback').textContent='👽 אופס! מערכת הניווט לא מזהה את התשובה. נסו כוכב אחר!';const buttons=[...$('planets').children];buttons[slot].animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});return}busy=true;arrival=p;score++;$('feedback').textContent='✨ תשובה נכונה! מתחילים השתגרות אל '+p[0]+'!';const tx=(16.5+slot*33.5)+'%',ty='35%';$('ship').style.setProperty('--tx',tx);$('ship').style.setProperty('--ty',ty);$('beam').style.setProperty('--tx',tx);$('beam').style.setProperty('--ty',ty);$('ship').classList.add('fly');$('beam').classList.add('on');const warp=document.createElement('div');warp.className='travel';warp.innerHTML='<div class="rocket">🚀</div><h2>משתגרים אל '+p[0]+'! ✨</h2>';setTimeout(()=>document.body.appendChild(warp),550);setTimeout(()=>{warp.remove();reveal()},2200)}
function reveal(){const q=questions[index];$('modalTitle').textContent='🌟 כל הכבוד! הגענו אל '+arrival[0]+'!';$('grammar').textContent='📚 '+q[0].toUpperCase()+' → '+q[1][q[2]].toUpperCase()+' · '+q[3];$('planetEmoji').textContent=icons[arrival[0]]||'🪐';$('planetTitle').textContent='🔭 מה גילינו על '+arrival[0]+'?';$('fact').textContent=arrival[3];$('next').textContent=index===questions.length-1?'🏆 מסיימים את המסע':'🚀 ממשיכים למסע הבא';$('overlay').classList.remove('hidden')}
function next(){if(!busy)return;index++;if(index>=questions.length){$('modalTitle').textContent='🏆 השלמתם את המסע בין כוכבי הלכת!';$('grammar').textContent='⭐ הצלחתם בכל 10 המשימות וגיליתם סודות אמיתיים של מערכת השמש!';$('planetEmoji').textContent='🏆';$('planetTitle').textContent='איזה חוקרי חלל מעולים!';$('fact').textContent='זיגי גאה בכם! 👽💜';$('next').textContent='🔁 משחקים שוב';$('next').onclick=()=>{index=0;score=0;$('next').onclick=next;render()};$('fill').style.width='100%';return}render()}
render();
</script></html>
