let index=0,score=0,busy=false,arrival=null;
const icons={'נפטון':'🔵','מאדים':'🔴','שבתאי':'🪐','צדק':'🟠','נוגה':'🟡','אורנוס':'🩵','כדור הארץ':'🌍','כוכב חמה':'🌑'};
function render(){busy=false;arrival=null;$('overlay').classList.add('hidden');$('ship').classList.remove('fly');$('beam').classList.remove('on');$('ship').removeAttribute('style');$('beam').removeAttribute('style');$('count').textContent='מסע '+(index+1)+' מתוך '+questions.length;$('score').textContent='⭐ '+score+' כוכבים';$('fill').style.width=(index/questions.length*100)+'%';$('word').textContent=questions[index][0].toUpperCase()+' → ?';$('feedback').textContent='';const q=questions[index];const order=shufflePool([0,1,2,3,4,5,6,7]).slice(0,3);const correctSlot=Math.floor(Math.random()*3);const choices=q[1].slice();const right=choices[q[2]];const arranged=[...choices.filter((_,i)=>i!==q[2])];arranged.splice(correctSlot,0,right);$('planets').innerHTML='';arranged.forEach((answer,slot)=>{const p=destinations[order[slot]];const b=document.createElement('button');b.className='planet-choice';b.setAttribute('aria-label',p[0]+', '+answer);b.innerHTML='<span class="orb" style="--glow:'+p[2]+'"></span><span class="answer">'+answer.toUpperCase()+'</span>';b.onclick=()=>choose(answer===right,slot,p);$('planets').appendChild(b)})}
function choose(correct,slot,p){if(busy)return;if(!correct){$('feedback').textContent='👽 אופס! מערכת הניווט לא מזהה את התשובה. נסו כוכב אחר!';const buttons=[...$('planets').children];buttons[slot].animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});return}busy=true;arrival=p;score++;$('feedback').textContent='✨ תשובה נכונה! החללית מקיפה את כוכב הלכת!';const arena=document.querySelector('.universe');const orb=$('planets').children[slot].querySelector('.orb');const ar=arena.getBoundingClientRect(),pr=orb.getBoundingClientRect(),sr=$('ship').getBoundingClientRect();const cx=pr.left+pr.width/2-ar.left,cy=pr.top+pr.height/2-ar.top;const sx=sr.left+sr.width/2-ar.left,sy=sr.top+sr.height/2-ar.top;const rx=pr.width*.82+30,ry=pr.height*.35+24;const frames=[{left:sx+'px',top:sy+'px',transform:'translate(-50%,-50%) scale(1) rotate(0deg)',opacity:1,offset:0}];const count=72;for(let i=0;i<=count;i++){const t=i/count,angle=-Math.PI/2+t*Math.PI*2;const x=cx+rx*Math.cos(angle),y=cy+ry*Math.sin(angle);const depth=Math.sin(angle);const scale=.52+.26*(depth+1)/2;frames.push({left:x+'px',top:y+'px',transform:'translate(-50%,-50%) scale('+scale+') rotate('+(t*360)+'deg)',opacity:1,offset:.16+.84*t})}const ship=$('ship');ship.style.bottom='auto';ship.style.left=sx+'px';ship.style.top=sy+'px';ship.style.transform='translate(-50%,-50%)';ship.style.transition='none';ship.style.zIndex='6';const flight=ship.animate(frames,{duration:2300,easing:'linear',fill:'forwards'});flight.onfinish=()=>{flight.cancel();ship.style.opacity='0';reveal()};}
function reveal(){const q=questions[index];$('modalTitle').textContent='🌟 כל הכבוד! הגענו אל '+arrival[0]+'!';$('grammar').textContent='📚 '+q[0].toUpperCase()+' → '+q[1][q[2]].toUpperCase()+' · '+q[3];$('planetEmoji').textContent=icons[arrival[0]]||'🪐';$('planetTitle').textContent='🔭 מה גילינו על '+arrival[0]+'?';$('fact').textContent=arrival[3];$('next').textContent=index===questions.length-1?'🏆 מסיימים את המסע':'🚀 ממשיכים למסע הבא';$('overlay').classList.remove('hidden')}
function next(){if(!busy)return;index++;if(index>=questions.length){$('modalTitle').textContent='🏆 השלמתם את המסע בין כוכבי הלכת!';$('grammar').textContent='⭐ הצלחתם בכל 10 המשימות וגיליתם סודות אמיתיים של מערכת השמש!';$('planetEmoji').textContent='🏆';$('planetTitle').textContent='איזה חוקרי חלל מעולים!';$('fact').textContent='זיגי גאה בכם! 👽💜';$('next').textContent='🔁 משחקים שוב';$('next').onclick=()=>{index=0;score=0;prepareQuestions();$('next').onclick=next;render()};$('fill').style.width='100%';return}render()}
prepareQuestions();render();
</script><script src="grammar-vocabulary.js?v=2"></script></html>
