<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicorn Word Magic | PLAYWISE</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;text-align:center;color:#3c2b66;background:radial-gradient(circle at 10% 20%,#fff 0 2px,transparent 4px),radial-gradient(circle at 80% 35%,#fff 0 3px,transparent 5px),radial-gradient(ellipse at 5% 5%,#d9ceff,transparent 55%),radial-gradient(ellipse at 95% 90%,#ffd9f2,transparent 50%),linear-gradient(135deg,#f6f1ff,#e9faff)}main{max-width:720px;margin:auto;padding:22px 16px 65px}.back{display:inline-block;color:#7052af;font-weight:bold;text-decoration:none;margin:8px}.card{margin:18px auto;background:#ffffffec;border:2px solid #e3d2ff;border-radius:30px;padding:26px 18px;box-shadow:0 12px 30px #61429c22}h1{font-size:clamp(30px,6vw,48px);color:#7047b9;margin:8px 0}.progress{font-size:18px;font-weight:bold;color:#7a51a9}.track{height:14px;background:#e9ddfa;border-radius:20px;overflow:hidden;margin:15px auto;max-width:450px}.fill{height:100%;background:linear-gradient(90deg,#a575e8,#f5b4df);width:0;transition:width .3s}.prompt{font-size:19px;margin:20px 0 8px}.question{font-size:clamp(32px,8vw,53px);font-weight:900;direction:ltr;color:#724bb6;margin:12px 0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px auto;max-width:550px}.option{min-height:88px;border:3px solid #cfb9f6;border-radius:22px;background:#f9f3ff;color:#49316e;font-size:clamp(17px,3.5vw,23px);font-weight:bold;cursor:pointer;padding:10px}.option:hover:not(:disabled){background:#eee0ff}.option:disabled{cursor:default}.option.correct{background:#d7ffe8;border-color:#49ba84}.option.wrong{background:#ffe1e7;border-color:#e77a8b}.feedback{min-height:36px;font-size:20px;font-weight:bold}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:24px;background:#7951c2;color:white;padding:12px 22px;font-size:18px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e9ddfa;color:#6545a0}.hidden{display:none}.finish{font-size:24px;line-height:1.8}@media(max-width:400px){.options{gap:9px}.option{min-height:76px}}</style></head><body><main><a class="back" href="sing-and-sparkle.html">🎵 חזרה לפינת המוזיקה</a><div style="font-size:50px">🦄🪄🌟</div><h1>Unicorn Word Magic</h1><div>משחק התאמת מילים קסום באנגלית!</div><section class="card" id="game"><div class="progress" id="progress">שאלה 1 מתוך 12 · ⭐ 0</div><div class="track"><div class="fill" id="fill"></div></div><p class="prompt">מה הפירוש של המילה?</p><div class="question" id="question">unicorn</div><button class="btn secondary" id="listen">🔊 לשמוע את המילה</button><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="btn hidden" id="next">לשאלה הבאה ✨</button></div></section><section class="card hidden" id="end"><div style="font-size:64px">🏆🦄✨</div><h2>איזה קסם! כל הכבוד!</h2><div class="finish" id="result"></div><div class="actions"><button class="btn" id="again">🔁 לשחק שוב</button><a class="btn secondary" href="sing-and-sparkle.html" style="text-decoration:none">🎶 חזרה לשיר</a></div></section></main><script>
const words=[["unicorn","חד־קרן"],["power","כוח"],["stand","לעמוד"],["talking","מדבר / מדברת"],["names","שמות"],["enemy","אויב"],["believe","להאמין"],["fairytales","אגדות"],["history","היסטוריה"],["change","לשנות"],["book","ספר"],["queen","מלכה"],["dance","לרקוד"],["phenomenal","מדהים / יוצא דופן"],["way","דרך / אופן"],["check","לבדוק"],["older","ישן יותר"],["stories","סיפורים"],["alone","לבד"],["learn","ללמוד"],["look","להסתכל"],["down","למטה"],["up","למעלה"],["turn","להסתובב"],["around","מסביב"],["write","לכתוב"],["new","חדש"],["world","עולם"],["watch","לצפות"],["feminine","נשי"],["better","טוב יותר"],["time","זמן"]];
const total=12;let round=[],index=0,stars=0,answered=false;const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(round[index][0]);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function start(){round=shuffle([...words]).slice(0,total);index=0;stars=0;$('game').classList.remove('hidden');$('end').classList.add('hidden');render()}
function render(){answered=false;const [w,h]=round[index];$('question').textContent=w;$('progress').textContent='שאלה '+(index+1)+' מתוך '+total+' · ⭐ '+stars;$('fill').style.width=(index/total*100)+'%';$('feedback').textContent='';$('next').classList.add('hidden');const distract=shuffle(words.filter(x=>x[0]!==w&&x[1]!==h)).slice(0,3);const opts=shuffle([[w,h],...distract]);$('options').replaceChildren();opts.forEach(([ow,oh])=>{const b=document.createElement('button');b.className='option';b.textContent=oh;b.onclick=()=>choose(b,ow===w);$('options').appendChild(b)})}
function choose(button,correct){if(answered)return;answered=true;const buttons=[...$('options').children];buttons.forEach(b=>{b.disabled=true;if(b.textContent===round[index][1])b.classList.add('correct')});if(correct){stars++;$('feedback').textContent='🌟 נכון מאוד! כוכב נוסף!'}else{button.classList.add('wrong');$('feedback').textContent='💜 כמעט! התשובה הנכונה מסומנת בירוק'}$('progress').textContent='שאלה '+(index+1)+' מתוך '+total+' · ⭐ '+stars;$('fill').style.width=((index+1)/total*100)+'%';$('next').textContent=index===total-1?'🏆 לראות את התוצאה':'לשאלה הבאה ✨';$('next').classList.remove('hidden')}
$('next').onclick=()=>{index++;if(index>=total){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='צברתם '+stars+' כוכבים מתוך '+total+'! ⭐'}else render()};$('listen').onclick=speak;$('again').onclick=start;start();
</script></body></html>
