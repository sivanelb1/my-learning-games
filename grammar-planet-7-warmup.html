<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חימום DO DOES · PLAYWISE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 10%,#56368e,transparent 48%),radial-gradient(ellipse at 90% 90%,#075f72,transparent 52%),#0b1231;color:white;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:15px 16px 60px}.back{display:inline-block;padding:11px 15px;background:#443375;color:white;border-radius:12px;text-decoration:none}h1{text-align:center;font-size:clamp(28px,5vw,42px);color:#ffe7a0}p.lead{text-align:center;line-height:1.6}.card{background:#fffaff;color:#3b285d;border-radius:22px;padding:clamp(18px,4vw,30px);margin-top:20px;box-shadow:0 14px 40px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:bold}.info{border:0;background:#e8ddff;color:#55338b;border-radius:50%;width:49px;height:49px;font-size:24px;font-weight:bold;cursor:pointer}.bar{height:12px;background:#e7def8;border-radius:20px;margin:18px 0;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#a76fea,#43c9b4);transition:width .2s}.sentence{direction:ltr;text-align:center;background:#eee7fc;padding:22px 12px;border-radius:17px;font-weight:bold;font-size:clamp(19px,4vw,27px);margin:22px 0}.answers{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.answers button{min-width:125px;border:0;border-radius:14px;padding:16px 22px;font-size:22px;font-weight:bold;color:white;background:#7d59c8;cursor:pointer}.answers button.good{background:#218b69}.answers button.bad{background:#d95267}.answers button:disabled{cursor:default}.msg{text-align:center;min-height:50px;font-size:18px;font-weight:bold;color:#7553a4;margin-top:17px}.next{display:block;margin:16px auto 0;border:0;background:#22a58e;color:white;font-size:19px;font-weight:bold;padding:14px 25px;border-radius:14px;cursor:pointer}.next[hidden]{display:none}.overlay{position:fixed;inset:0;background:#090d2dcc;display:grid;place-items:center;z-index:20;padding:15px}.overlay[hidden]{display:none}.modal{background:#fffaff;color:#362650;border-radius:24px;padding:25px;max-width:570px;width:100%;line-height:1.8;box-shadow:0 15px 60px #0006}.modal h2{margin:0 0 10px}.close{float:left;border:0;background:#eee5ff;color:#593991;border-radius:12px;font-size:20px;padding:5px 12px;cursor:pointer}.example{direction:ltr;text-align:center;background:#f0eafa;padding:10px;border-radius:10px;font-weight:bold}.done{text-align:center}.done h2{font-size:30px}.hint{text-align:center;font-size:14px;opacity:.85;margin-top:15px}
</style></head><body><main class="wrap"><a class="back" href="grammar-planet-7.html">↩️ חזרה ל־QUESTION ORBIT</a><h1 id="title">🌟 חימום קצר</h1><p class="lead" id="lead">5 שאלות קלות לפני משחק הארקייד!</p><section class="card" id="game"><div class="top"><span id="counter">שאלה 1 מתוך 5</span><button class="info" id="info" aria-label="INFORMATION — תזכורת" title="INFORMATION — תזכורת">ⓘ</button></div><p class="hint">💡 צריכים תזכורת? לחצו על ⓘ INFORMATION</p><div class="bar"><div id="progress"></div></div><div class="sentence" id="sentence"></div><div class="answers"><button id="a" onclick="choose('do')">DO</button><button id="b" onclick="choose('does')">DOES</button></div><p class="msg" id="msg">בחרו את המילה המתאימה</p><button class="next" id="next" hidden onclick="advance()">לשאלה הבאה ←</button></section><section class="card done" id="done" hidden><h2>🎉 כל הכבוד!</h2><p>סיימתם 5 שאלות! עכשיו אתם מוכנים למשחק האמיתי.</p><button class="next" onclick="location.href=destination">🚀 מתחילים במשחק!</button><p><a href="grammar-planet-7.html">חזרה למסלול</a></p></section></main><div class="overlay" id="overlay" hidden><div class="modal"><button class="close" onclick="closeInfo()" aria-label="סגירה">✕</button><h2>ⓘ INFORMATION — תזכורת</h2><div id="infoText"></div><button class="next" onclick="closeInfo()">הבנתי! 💜</button></div></div><script>
const negative=new URLSearchParams(location.search).get('mode')==='negative',destination=negative?'grammar-planet-7-breakout.html':'grammar-planet-7-invaders.html';const $=id=>document.getElementById(id);
const questions=negative?[['I','like onions','do'],['She','play tennis','does'],['They','eat fish','do'],['My dad','watch cartoons','does'],['We','go to school on Sunday','do']]:[['I','like apples','do'],['He','play football','does'],['They','have a dog','do'],['My sister','read books','does'],['You','speak English','do']];
let order=[],idx=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){order=shuffle(questions.slice());idx=0;$('title').textContent=negative?'🚫 חימום השלילה — DON’T / DOESN’T':'❓ חימום השאלות — DO / DOES';$('lead').textContent=negative?'5 משפטי שלילה קלים לפני שוברים את השלילה!':'5 שאלות קלות לפני פולשי השאלות!';$('a').textContent=negative?"DON'T":"DO";$('b').textContent=negative?"DOESN'T":"DOES";$('infoText').innerHTML=negative?'<p><b>DON’T</b> מתאים ל־<b>I · YOU · WE · THEY</b> ולשמות עצם ברבים.</p><p><b>DOESN’T</b> מתאים ל־<b>HE · SHE · IT</b> ולשם עצם יחיד.</p><div class="example">They don’t play. / She doesn’t play.</div><p>💡 אחרי DOESN’T הפועל נשאר בצורה הרגילה: <b>She doesn’t play</b> (לא plays).</p>':'<p><b>DO</b> מתאים ל־<b>I · YOU · WE · THEY</b> ולשמות עצם ברבים.</p><p><b>DOES</b> מתאים ל־<b>HE · SHE · IT</b> ולשם עצם יחיד.</p><div class="example">Do they play? / Does she play?</div><p>💡 בשאלה DO / DOES מגיע בתחילת המשפט. אחרי DOES הפועל נשאר בצורה הרגילה: <b>Does he play?</b> (לא plays).</p>';render()}
function render(){locked=false;const q=order[idx];$('counter').textContent='שאלה '+(idx+1)+' מתוך 5';$('progress').style.width=(idx/5*100)+'%';$('sentence').textContent=negative?q[0]+' ___ '+q[1]+'.':'___ '+q[0]+' '+q[1]+'?';$('msg').textContent='בחרו את המילה המתאימה';$('next').hidden=true;for(const id of ['a','b']){$(id).disabled=false;$(id).className=''}}
function choose(a){if(locked)return;const good=order[idx][2]===a,button=$(a==='do'?'a':'b');if(!good){button.classList.add('bad');$('msg').textContent='💜 כמעט! בדקו אם הנושא ביחיד או ברבים ונסו שוב.';setTimeout(()=>button.classList.remove('bad'),900);return}locked=true;button.classList.add('good');$('msg').textContent='🌟 נכון מאוד!';$('next').hidden=false;$('next').textContent=idx===4?'🚀 למשחק הבא!':'לשאלה הבאה ←';$('progress').style.width=((idx+1)/5*100)+'%';for(const id of ['a','b'])$(id).disabled=true}
function advance(){idx++;if(idx===5){$('game').hidden=true;$('done').hidden=false;return}render()}
function closeInfo(){$('overlay').hidden=true}$('info').onclick=()=>{$('overlay').hidden=false};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeInfo()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo()});init();
</script><script src="grammar-vocabulary.js?v=2"></script><script src="grammar-stage-navigation.js?v=2"></script></body></html>
