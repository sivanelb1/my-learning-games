<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYWISE | משחקי אוצר מילים למבחן</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#ffe1ee,transparent 40%),radial-gradient(circle at 90% 5%,#d8f6ff,transparent 40%),linear-gradient(140deg,#f8f2ff,#fff9ef);color:#50377c}button{font:inherit;cursor:pointer}.wrap{max-width:970px;margin:auto;padding:24px 16px 55px}.hero{text-align:center;background:linear-gradient(120deg,#7952bd,#ad7bd7,#f2a1c0);color:white;border-radius:30px;padding:24px 18px;box-shadow:0 12px 28px #8557ab33}.hero h1{font-size:clamp(26px,5vw,42px);margin:6px}.hero p{margin:8px;font-size:17px}.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.pick{background:white;border:3px solid #e2d2f3;border-radius:22px;padding:18px 10px;min-height:140px;color:#6d4b9d;box-shadow:0 5px 0 #e8dcf0;font-weight:900}.pick .emoji{display:block;font-size:37px;margin-bottom:8px}.pick small{display:block;font-weight:600;margin-top:7px;color:#9473a8}.pick.active{background:#7852ba;border-color:#6742a8;color:white}.pick.active small{color:#f3e4ff}.card{background:#fff;border:2px solid #e4d3f4;border-radius:27px;padding:clamp(16px,4vw,31px);box-shadow:0 12px 30px #7656a51c}.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:900}.progress{height:14px;border-radius:30px;background:#f0e8fa;overflow:hidden;margin:16px 0 24px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#88d9b3,#a47ce1,#f59abf);transition:width .35s}.question{text-align:center;background:linear-gradient(130deg,#f9f2ff,#fff7e8);border:2px solid #e8d8f5;border-radius:23px;padding:23px 12px}.question .pic{font-size:54px}.question .ask{font-size:16px;color:#81649e;font-weight:800;margin:10px 0}.question .term{font-size:clamp(27px,5vw,43px);font-weight:900;direction:ltr;unicode-bidi:isolate;display:block;margin:12px 0;color:#6842aa}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px 0}.answer{border:2px solid #dac6f0;border-radius:18px;background:white;min-height:78px;padding:12px;font-size:clamp(16px,2.7vw,21px);font-weight:800;color:#62418d;transition:transform .14s,background .14s}.answer:hover:not(:disabled){transform:translateY(-3px);background:#f8f0ff}.answer.correct{background:#dff8e9;border-color:#55bb88;color:#22684a}.answer.wrong{background:#ffe5eb;border-color:#ed7997;color:#a13c5c}.answer:disabled{cursor:default}.feedback{text-align:center;font-size:19px;min-height:35px;font-weight:900}.reward{display:none;text-align:center;background:#effcf4;border:2px solid #9bdfb7;border-radius:20px;padding:12px;margin:14px auto;max-width:420px}.reward.show{display:block;animation:pop .35s ease-out}.reward .pic{font-size:65px;line-height:1.2}.reward .word{font-size:26px;font-weight:900;color:#4c7a5d;direction:ltr;unicode-bidi:isolate}.reward .meaning{font-size:17px;color:#4b7660}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.actions{text-align:center}.next{border:0;border-radius:18px;background:#7751b6;color:white;padding:14px 32px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #503080}.next:disabled{opacity:.4;cursor:default}.hidden{display:none!important}.finish{text-align:center;padding:20px}.finish .trophy{font-size:72px}.finish h2{font-size:31px;color:#6c45aa}.finish p{line-height:1.8;font-size:19px}.helper{text-align:center;color:#876da0;font-size:14px;margin-top:14px}.speak{border:0;border-radius:50%;background:#f0e1ff;color:#6c45a3;width:45px;height:45px;font-size:22px}.bottom{text-align:center;margin-top:16px}.bottom a{color:#7753ad;font-weight:900}@media(max-width:590px){.picker{gap:7px}.pick{min-height:125px;padding:11px 5px;font-size:12px}.pick .emoji{font-size:30px}.pick small{font-size:11px}.answers{gap:9px}.answer{min-height:70px}.hero{padding:18px 10px}}

.board-instructions{text-align:center;color:#79599d;line-height:1.6;margin:8px 0 20px}.match-layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}.match-column{background:#f9f5ff;border:2px solid #e4d7f5;border-radius:20px;padding:12px}.match-column h3{font-size:18px;text-align:center;margin:0 0 12px}.match-list{display:grid;gap:9px}.target,.tile{min-height:66px;border-radius:15px;border:2px solid #dfc9ef;padding:10px;background:white;color:#64458d;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:manipulation}.target{flex-direction:column;gap:5px;border-style:dashed}.target.over{background:#e8dafa;border-color:#9366c9;transform:scale(1.02)}.target.done{background:#e4f9ec;border:2px solid #8bd3aa;color:#317453}.target .matched{font-size:14px;font-weight:700}.tile{cursor:grab;background:#fff6e7;border-color:#f0d5a1;user-select:none}.tile.selected{background:#e4d4ff;border-color:#7952ba;box-shadow:0 0 0 3px #bba0ec}.tile:active{cursor:grabbing}.tile:focus-visible,.target:focus-visible{outline:3px solid #f4bd59}.tile.wrong,.target.wrong{animation:shake .32s;background:#ffe4e8;border-color:#ef7893}.tile.placeholder{visibility:hidden}.round-reward{text-align:center;margin:14px 0;min-height:26px}.round-reward.show{background:#ebfaee;border:2px solid #a0dbb3;border-radius:18px;padding:10px}.round-reward .pic{font-size:43px}.round-reward strong{display:block;direction:ltr;font-size:23px}.round-reward small{display:block;font-size:15px}.round-reward p{margin:5px}.board-footer{text-align:center;margin-top:16px}.hint{text-align:center;font-size:13px;color:#896aa4;margin:12px}.round-end{text-align:center;font-size:19px;color:#5c9b6d;font-weight:900;margin:15px 0}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-width:590px){.match-layout{gap:7px}.match-column{padding:7px}.target,.tile{font-size:14px;min-height:66px;padding:6px}.match-column h3{font-size:15px}}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:38px">🎒✨🎮</div><h1>הרפתקאות אוצר המילים</h1><p>Vocabulary Adventures · PLAYWISE</p><p>בחרו עולם, מצאו את התשובה וצברו כוכבים!</p></header><div class="picker" id="picker"></div><section class="card"><div id="game"></div></section><div class="bottom"><a href="exam-prep.html#vocab" target="_top">↩ חזרה להכנה למבחן</a></div></main><script>
(()=>{"use strict";const games=[{"title":"ממלכת המילים והעונות","emoji":"🌷","subtitle":"Letters & Seasons","items":[["animal","בעל חיים","🐾"],["bag","תיק","🎒"],["car","מכונית","🚗"],["mother","אמא","👩"],["family","משפחה","👨‍👩‍👧"],["room","חדר","🛏️"],["school","בית ספר","🏫"],["sister","אחות","👧"],["bus","אוטובוס","🚌"],["hair","שיער","💇"],["chair","כיסא","🪑"],["mouth","פה","👄"],["pencil","עיפרון","✏️"],["open","לפתוח","🚪"],["help","לעזור","🤝"],["tea","תה","🍵"],["water","מים","💧"],["cat","חתול","🐈"],["in","בתוך","📥"],["igloo","איגלו","🧊"],["Internet","אינטרנט","🌐"],["Indian","יליד אמריקאי","🌎"],["ink","דיו","🖋️"],["Italy","איטליה","🇮🇹"],["spring","אביב","🌷"],["summer","קיץ","☀️"],["autumn / fall","סתיו","🍂"],["winter","חורף","❄️"]]},{"title":"מסע ימות השבוע","emoji":"📅","subtitle":"Days of the Week","items":[["Sunday","יום ראשון","☀️"],["Monday","יום שני","🌼"],["Tuesday","יום שלישי","🌸"],["Wednesday","יום רביעי","⭐"],["Thursday","יום חמישי","🌈"],["Friday","יום שישי","🎉"],["Saturday","יום שבת","💜"]]},{"title":"גלגל חודשי השנה","emoji":"🗓️","subtitle":"Months of the Year","items":[["January","ינואר","❄️"],["February","פברואר","💗"],["March","מרץ","🌷"],["April","אפריל","🌸"],["May","מאי","🌼"],["June","יוני","☀️"],["July","יולי","🏖️"],["August","אוגוסט","🍉"],["September","ספטמבר","🍎"],["October","אוקטובר","🍂"],["November","נובמבר","☁️"],["December","דצמבר","🎁"]]}];const $=id=>document.getElementById(id);
let current=0,order=[],round=0,score=0,mistakes=0,selected=null,done=new Set(),locked=false;
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function pronounce(word){try{if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word.replace(" / "," or "));u.lang="en-US";u.rate=.78;window.speechSynthesis.speak(u)}catch(e){}}
function pickers(){$("picker").innerHTML="";games.forEach((g,i)=>{const b=document.createElement("button");b.className="pick"+(i===current?" active":"");b.innerHTML='<span class="emoji">'+g.emoji+'</span>'+g.title+'<small>'+g.subtitle+'</small>';b.onclick=()=>start(i);$("picker").appendChild(b)})}
function start(i){current=i;order=shuffle(games[i].items.map((_,k)=>k));round=0;score=0;mistakes=0;selected=null;done=new Set();locked=false;pickers();render()}
function currentKeys(){return order.slice(round*7,(round+1)*7)}
function render(){const keys=currentKeys();if(!keys.length){finish();return}selected=null;done=new Set();locked=false;const total=Math.ceil(order.length/7),g=games[current];$("game").innerHTML='<div class="stats"><span id="score">⭐ '+score+' נקודות</span><span>לוח '+(round+1)+' מתוך '+total+'</span><span id="counter">0 / '+keys.length+' התאמות</span></div><div class="progress"><div id="bar" style="width:'+Math.round(round*7/order.length*100)+'%"></div></div><p class="board-instructions">🧩 גררו כל תרגום בעברית אל המילה המתאימה באנגלית.<br>בטלפון אפשר גם ללחוץ על תשובה ואז על המילה המתאימה.</p><div class="match-layout"><div class="match-column"><h3>🇬🇧 מילים באנגלית</h3><div class="match-list" id="targets"></div></div><div class="match-column"><h3>🇮🇱 התשובות בעברית</h3><div class="match-list" id="tiles"></div></div></div><div id="reward" class="round-reward" aria-live="polite"></div><div id="roundEnd" class="round-end"></div><div class="board-footer"><button class="next hidden" id="continue">ללוח הבא ←</button></div><p class="hint">✨ אחרי התאמה נכונה מופיעים איור והקראה · כל תשובה נכונה נעלמת מהלוח</p>';
const items=g.items;
keys.forEach(k=>{const b=document.createElement("button");b.type="button";b.className="target";b.dataset.key=k;b.textContent=items[k][0];b.setAttribute("aria-label","התאימי תרגום למילה "+items[k][0]);b.addEventListener("dragover",e=>{if(done.has(k))return;e.preventDefault();b.classList.add("over")});b.addEventListener("dragleave",()=>b.classList.remove("over"));b.addEventListener("drop",e=>{e.preventDefault();b.classList.remove("over");const from=e.dataTransfer.getData("text/plain");if(from!=="")match(Number(from),k)});b.onclick=()=>{if(selected!==null)match(selected,k)};$("targets").appendChild(b)});
shuffle(keys).forEach(k=>{const b=document.createElement("button");b.type="button";b.className="tile";b.draggable=true;b.dataset.key=k;b.textContent=items[k][1];b.setAttribute("aria-label","גררי "+items[k][1]);b.addEventListener("dragstart",e=>{if(done.has(k)){e.preventDefault();return}selected=k;e.dataTransfer.setData("text/plain",String(k));e.dataTransfer.effectAllowed="move"});b.addEventListener("dragend",()=>{b.classList.remove("selected")});b.onclick=()=>{if(done.has(k))return;selected=k;document.querySelectorAll(".tile").forEach(x=>x.classList.toggle("selected",Number(x.dataset.key)===k))};$("tiles").appendChild(b)});
$("continue").onclick=()=>{round++;render()}}
function match(from,to){if(locked||done.has(from)||done.has(to))return;const tile=[...document.querySelectorAll(".tile")].find(x=>Number(x.dataset.key)===from),target=[...document.querySelectorAll(".target")].find(x=>Number(x.dataset.key)===to);if(!tile||!target)return;if(from!==to){mistakes++;[tile,target].forEach(el=>{el.classList.remove("wrong");void el.offsetWidth;el.classList.add("wrong")});return}done.add(from);score+=10;selected=null;tile.remove();target.classList.remove("over");target.classList.add("done");target.innerHTML="";const english=document.createElement("strong");english.textContent=games[current].items[from][0];const matched=document.createElement("span");matched.className="matched";matched.textContent="✓ "+games[current].items[from][1];target.append(english,matched);document.querySelectorAll(".tile").forEach(x=>x.classList.remove("selected"));const item=games[current].items[from];$("reward").className="round-reward show";$("reward").innerHTML='<div class="pic"></div><strong></strong><small></small>';$("reward").querySelector(".pic").textContent=item[2];$("reward").querySelector("strong").textContent=item[0];$("reward").querySelector("small").textContent=item[1];pronounce(item[0]);$("score").textContent="⭐ "+score+" נקודות";$("counter").textContent=done.size+" / "+currentKeys().length+" התאמות";$("bar").style.width=Math.round((round*7+done.size)/order.length*100)+"%";if(done.size===currentKeys().length){locked=true;$("roundEnd").textContent="🎉 כל הכבוד! כל התשובות בלוח הותאמו!";$("continue").classList.remove("hidden");$("continue").textContent=(round+1)*7>=order.length?"🏆 לסיום המשחק":"ללוח הבא ←"}}
function finish(){const stars=mistakes===0?3:mistakes<=5?2:1;$("game").innerHTML='<div class="finish"><div class="trophy">🏆🌟</div><h2>כל הכבוד! סיימת את כל ההתאמות!</h2><p>⭐ צברת '+score+' נקודות<br>התאמת '+order.length+' מילים וביטויים!<br>כוכבים: '+("🌟".repeat(stars))+'</p><button class="next" id="again">🔄 משחקים שוב</button></div>';$("again").onclick=()=>start(current)}
start(0)})();
</script></body></html>
