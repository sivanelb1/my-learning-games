<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYWISE | משחקי אוצר מילים למבחן</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#ffe1ee,transparent 40%),radial-gradient(circle at 90% 5%,#d8f6ff,transparent 40%),linear-gradient(140deg,#f8f2ff,#fff9ef);color:#50377c}button{font:inherit;cursor:pointer}.wrap{max-width:970px;margin:auto;padding:24px 16px 55px}.hero{text-align:center;background:linear-gradient(120deg,#7952bd,#ad7bd7,#f2a1c0);color:white;border-radius:30px;padding:24px 18px;box-shadow:0 12px 28px #8557ab33}.hero h1{font-size:clamp(26px,5vw,42px);margin:6px}.hero p{margin:8px;font-size:17px}.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.pick{background:white;border:3px solid #e2d2f3;border-radius:22px;padding:18px 10px;min-height:140px;color:#6d4b9d;box-shadow:0 5px 0 #e8dcf0;font-weight:900}.pick .emoji{display:block;font-size:37px;margin-bottom:8px}.pick small{display:block;font-weight:600;margin-top:7px;color:#9473a8}.pick.active{background:#7852ba;border-color:#6742a8;color:white}.pick.active small{color:#f3e4ff}.card{background:#fff;border:2px solid #e4d3f4;border-radius:27px;padding:clamp(16px,4vw,31px);box-shadow:0 12px 30px #7656a51c}.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:900}.progress{height:14px;border-radius:30px;background:#f0e8fa;overflow:hidden;margin:16px 0 24px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#88d9b3,#a47ce1,#f59abf);transition:width .35s}.question{text-align:center;background:linear-gradient(130deg,#f9f2ff,#fff7e8);border:2px solid #e8d8f5;border-radius:23px;padding:23px 12px}.question .pic{font-size:54px}.question .ask{font-size:16px;color:#81649e;font-weight:800;margin:10px 0}.question .term{font-size:clamp(27px,5vw,43px);font-weight:900;direction:ltr;unicode-bidi:isolate;display:block;margin:12px 0;color:#6842aa}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px 0}.answer{border:2px solid #dac6f0;border-radius:18px;background:white;min-height:78px;padding:12px;font-size:clamp(16px,2.7vw,21px);font-weight:800;color:#62418d;transition:transform .14s,background .14s}.answer:hover:not(:disabled){transform:translateY(-3px);background:#f8f0ff}.answer.correct{background:#dff8e9;border-color:#55bb88;color:#22684a}.answer.wrong{background:#ffe5eb;border-color:#ed7997;color:#a13c5c}.answer:disabled{cursor:default}.feedback{text-align:center;font-size:19px;min-height:35px;font-weight:900}.reward{display:none;text-align:center;background:#effcf4;border:2px solid #9bdfb7;border-radius:20px;padding:12px;margin:14px auto;max-width:420px}.reward.show{display:block;animation:pop .35s ease-out}.reward .pic{font-size:65px;line-height:1.2}.reward .word{font-size:26px;font-weight:900;color:#4c7a5d;direction:ltr;unicode-bidi:isolate}.reward .meaning{font-size:17px;color:#4b7660}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}.actions{text-align:center}.next{border:0;border-radius:18px;background:#7751b6;color:white;padding:14px 32px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #503080}.next:disabled{opacity:.4;cursor:default}.hidden{display:none!important}.finish{text-align:center;padding:20px}.finish .trophy{font-size:72px}.finish h2{font-size:31px;color:#6c45aa}.finish p{line-height:1.8;font-size:19px}.helper{text-align:center;color:#876da0;font-size:14px;margin-top:14px}.speak{border:0;border-radius:50%;background:#f0e1ff;color:#6c45a3;width:45px;height:45px;font-size:22px}.bottom{text-align:center;margin-top:16px}.bottom a{color:#7753ad;font-weight:900}@media(max-width:590px){.picker{gap:7px}.pick{min-height:125px;padding:11px 5px;font-size:12px}.pick .emoji{font-size:30px}.pick small{font-size:11px}.answers{gap:9px}.answer{min-height:70px}.hero{padding:18px 10px}}
</style></head><body><main class="wrap"><header class="hero"><div style="font-size:38px">🎒✨🎮</div><h1>הרפתקאות אוצר המילים</h1><p>Vocabulary Adventures · PLAYWISE</p><p>בחרו עולם, מצאו את התשובה וצברו כוכבים!</p></header><div class="picker" id="picker"></div><section class="card"><div id="game"></div></section><div class="bottom"><a href="exam-prep.html#vocab" target="_top">↩ חזרה להכנה למבחן</a></div></main><script>
(()=>{"use strict";const games=[{"title":"ממלכת המילים והעונות","emoji":"🌷","subtitle":"Letters & Seasons","items":[["animal","בעל חיים","🐾"],["bag","תיק","🎒"],["car","מכונית","🚗"],["mother","אמא","👩"],["family","משפחה","👨‍👩‍👧"],["room","חדר","🛏️"],["school","בית ספר","🏫"],["sister","אחות","👧"],["bus","אוטובוס","🚌"],["hair","שיער","💇"],["chair","כיסא","🪑"],["mouth","פה","👄"],["pencil","עיפרון","✏️"],["open","לפתוח","🚪"],["help","לעזור","🤝"],["tea","תה","🍵"],["water","מים","💧"],["cat","חתול","🐈"],["in","בתוך","📥"],["igloo","איגלו","🧊"],["Internet","אינטרנט","🌐"],["Indian","יליד אמריקאי","🌎"],["ink","דיו","🖋️"],["Italy","איטליה","🇮🇹"],["spring","אביב","🌷"],["summer","קיץ","☀️"],["autumn / fall","סתיו","🍂"],["winter","חורף","❄️"]]},{"title":"מסע ימות השבוע","emoji":"📅","subtitle":"Days of the Week","items":[["Sunday","יום ראשון","☀️"],["Monday","יום שני","🌼"],["Tuesday","יום שלישי","🌸"],["Wednesday","יום רביעי","⭐"],["Thursday","יום חמישי","🌈"],["Friday","יום שישי","🎉"],["Saturday","יום שבת","💜"]]},{"title":"גלגל חודשי השנה","emoji":"🗓️","subtitle":"Months of the Year","items":[["January","ינואר","❄️"],["February","פברואר","💗"],["March","מרץ","🌷"],["April","אפריל","🌸"],["May","מאי","🌼"],["June","יוני","☀️"],["July","יולי","🏖️"],["August","אוגוסט","🍉"],["September","ספטמבר","🍎"],["October","אוקטובר","🍂"],["November","נובמבר","☁️"],["December","דצמבר","🎁"]]}];const $=id=>document.getElementById(id);let current=0,queue=[],index=0,score=0,lives=5,locked=false,correct=false;function pronounce(word){try{if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word.replace(" / "," or "));u.lang="en-US";u.rate=.8;window.speechSynthesis.speak(u)}catch(e){}}const shuffle=a=>{let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function pickers(){$("picker").innerHTML="";games.forEach((g,i)=>{let b=document.createElement("button");b.className="pick"+(i===current?" active":"");b.innerHTML='<span class="emoji">'+g.emoji+'</span>'+g.title+'<small>'+g.subtitle+'</small>';b.onclick=()=>start(i);$("picker").appendChild(b)})}function start(i){current=i;index=0;score=0;lives=5;locked=false;correct=false;let all=games[i].items.map((v,k)=>({k,reverse:false}));if(i===0){queue=shuffle(all)}else{queue=shuffle(all.concat(all.map(x=>({k:x.k,reverse:true}))))}pickers();render()}function options(item,reverse){let all=games[current].items,correctText=item[reverse?0:1],pool=all.map(x=>x[reverse?0:1]).filter(x=>x!==correctText);let distractors=shuffle([...new Set(pool)]).slice(0,3);return shuffle([correctText,...distractors])}function render(){if(index>=queue.length||lives<=0){finish();return}locked=false;correct=false;const g=games[current],q=queue[index],item=g.items[q.k],reverse=q.reverse,ans=item[reverse?0:1],opts=options(item,reverse);$("game").innerHTML='<div class="stats"><span>⭐ '+score+' נקודות</span><span>שאלה '+(index+1)+' / '+queue.length+'</span><span>'+('❤️'.repeat(lives))+('🤍'.repeat(5-lives))+'</span></div><div class="progress"><div style="width:'+Math.round(index/queue.length*100)+'%"></div></div><div class="question"><div class="ask">'+(reverse?'איך אומרים באנגלית?':'מה פירוש המילה?')+'</div><span class="term" id="term"></span></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="reward" id="reward" aria-live="polite"><div class="pic" id="rewardPic"></div><div class="word" id="rewardWord"></div><div class="meaning" id="rewardMeaning"></div></div><div class="actions"><button class="next" id="next" disabled>לשאלה הבאה ←</button></div><div class="helper">💜 בחירה נכונה מעניקה 10 נקודות · טעות מורידה לב אחד</div>';$("term").textContent=item[reverse?1:0];$("term").style.direction=reverse?"rtl":"ltr";$("next").onclick=()=>{index++;render()};opts.forEach(opt=>{let b=document.createElement("button");b.className="answer";b.textContent=opt;b.onclick=()=>{if(locked)return;if(opt===ans){locked=true;correct=true;score+=10;b.classList.add("correct");$("feedback").textContent="✨ מדהים! תשובה נכונה!";$("rewardPic").textContent=item[2];$("rewardWord").textContent=item[0];$("rewardMeaning").textContent=item[1];$("reward").classList.add("show");pronounce(item[0]);[...$("answers").children].forEach(x=>x.disabled=true);$("next").disabled=false;$("next").textContent=index===queue.length-1?"🏆 לסיום המשחק":"לשאלה הבאה ←"}else{lives--;b.classList.add("wrong");b.disabled=true;$("feedback").textContent="💗 כמעט! נסי שוב";$("game").querySelector(".stats span:last-child").textContent='❤️'.repeat(lives)+'🤍'.repeat(5-lives);if(lives<=0){locked=true;[...$("answers").children].forEach(x=>x.disabled=true);$("next").disabled=false;$("next").textContent="לסיכום המשחק ←";$("next").onclick=finish}}};$("answers").appendChild(b)})}function finish(){let won=index>=queue.length;let stars=won?(lives>=4?3:lives>=2?2:1):0;$("game").innerHTML='<div class="finish"><div class="trophy">'+(won?'🏆🌟':'💗🎈')+'</div><h2>'+(won?'כל הכבוד! סיימת את המשחק!':'איזה יופי שניסית!')+'</h2><p>⭐ צברת '+score+' נקודות<br>'+(won?'כוכבים: '+('🌟'.repeat(stars)):'אפשר לנסות שוב ולהצליח!')+'</p><button class="next" id="again">🔄 משחקים שוב</button></div>';$("again").onclick=()=>start(current)}start(0)})();
</script></body></html>
