<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYWISE | כניסת מנהלת</title><style>body{margin:0;font-family:Arial,sans-serif;direction:rtl;background:linear-gradient(135deg,#f0eaff,#e8f9ff);color:#26304e;min-height:100vh;display:grid;place-items:center}.panel{width:min(94vw,520px);background:white;border-radius:26px;box-shadow:0 16px 50px #33447722;padding:30px;box-sizing:border-box}h1{color:#35216e}label{display:block;margin:16px 0 6px;font-weight:bold}input,select,button{font:inherit;box-sizing:border-box}input,select{width:100%;padding:13px;border:1px solid #b9b4d0;border-radius:12px}button{padding:13px 19px;border:0;border-radius:13px;background:#6552d9;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.muted{color:#657087;font-size:14px}.error{color:#ad1b43}a{color:#5144bb}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.notice{background:#fff6db;padding:12px;border-radius:12px;margin:18px 0}</style></head><body><main class="panel"><h1>🎓 PLAYWISE</h1><h2>כניסה למערכת הניהול</h2><p class="muted">כניסה לחשבון שהוגדר ב־Firebase Authentication.</p><form id="login"><label for="email">כתובת מייל</label><input id="email" type="email" autocomplete="username" required><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password" required><p id="message" role="status"></p><button id="submit">התחברות 🔐</button></form><p><a href="index.html">חזרה לאתר</a></p></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";const firebaseConfig={apiKey:"AIzaSyBPoo0HcIfWIQ-kBA3bj4FUxyP1TTDxnp4",authDomain:"playwise-learning.firebaseapp.com",projectId:"playwise-learning",storageBucket:"playwise-learning.firebasestorage.app",messagingSenderId:"39738730345",appId:"1:39738730345:web:adacb886306aaa62613ff8",measurementId:"G-T2G6DGPXE7"};const auth=getAuth(initializeApp(firebaseConfig));const adminUid="h08EuZLscigEG3xE0xz81ycISOA2";onAuthStateChanged(auth,user=>{if(user?.uid===adminUid)location.replace("playwise-admin.html")});document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit"),msg=document.getElementById("message");btn.disabled=true;msg.textContent="מתחברים...";try{const r=await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);if(r.user.uid!==adminUid){msg.textContent="החשבון אינו מוגדר כמנהלת.";await auth.signOut()}else location.replace("playwise-admin.html")}catch(err){console.error(err.code);const reasons={"auth/invalid-credential":"המייל או הסיסמה לא זוהו ב־Firebase. בדקי שהמייל זהה למייל של המשתמש שיצרת.","auth/invalid-email":"כתובת המייל אינה תקינה.","auth/unauthorized-domain":"צריך להוסיף את sivanelb1.github.io לדומיינים המורשים ב־Firebase Authentication.","auth/network-request-failed":"נראה שיש בעיית חיבור לרשת או חסימה של Firebase.","auth/too-many-requests":"בוצעו יותר מדי ניסיונות. המתיני מעט ונסי שוב.","auth/api-key-not-valid.-please-pass-a-valid-api-key.":"הגדרות החיבור ל־Firebase אינן תקינות."};msg.textContent=(reasons[err.code]||"לא הצלחנו להתחבר. קוד שגיאה: "+(err.code||"לא ידוע"))}finally{btn.disabled=false}});</script></body></html>
