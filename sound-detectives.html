<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בלשי הצלילים</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#170e35;color:#fff}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.55}
.app{min-height:100dvh;max-width:1150px;margin:auto;padding:clamp(12px,2vw,24px);display:flex;flex-direction:column;gap:14px;background:radial-gradient(circle at 20% 10%,#513293,#1a103e 75%)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:white;text-decoration:none;background:#583ba3;border:2px solid #9b7ae0;border-radius:14px;padding:9px 13px;font-weight:bold}h1{margin:0;font-size:clamp(23px,3.6vw,40px);text-align:center}.stats{display:flex;gap:12px;align-items:center;font-weight:bold;font-size:clamp(14px,2vw,20px)}.hearts{color:#ff6688}.progress{height:12px;background:#3d2d67;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#ffcc52;transition:width .3s}.stage{text-align:center;font-size:clamp(14px,1.8vw,19px);color:#d7c9ff}
.panel{flex:1;min-height:0;background:#fff;color:#2d195c;border-radius:28px;padding:clamp(14px,3vw,30px);box-shadow:0 10px 0 #6d4cb6;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:15px}.phase{font-size:clamp(21px,3vw,33px);font-weight:800;text-align:center}.help{text-align:center;color:#68568a;font-size:clamp(14px,1.8vw,19px)}.listen{border:0;border-radius:50px;background:#7d45d6;color:white;padding:14px 25px;font-size:clamp(18px,2.5vw,26px);font-weight:bold;box-shadow:0 5px 0 #54269f}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,2vw,25px);width:100%;max-width:850px;direction:ltr}.choice{min-height:clamp(115px,22vh,205px);border:4px solid #d6c4f7;border-radius:24px;background:#faf6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#34206d;transition:transform .12s,background .12s}.choice:hover:not(:disabled){transform:translateY(-3px);background:#eee3ff}.choice:focus-visible{outline:4px solid #ffbb28}.picture{font-size:clamp(50px,11vmin,115px);line-height:1.2}.word{font-size:clamp(20px,3vw,34px);font-weight:900}.sound{font-size:clamp(32px,6vw,68px);font-weight:900;letter-spacing:2px}.choice.correct{border-color:#29a660;background:#ddf9e7}.choice.wrong{border-color:#e94e70;background:#ffe4e8}.message{min-height:35px;text-align:center;font-size:clamp(18px,2.5vw,26px);font-weight:bold}.next{border:0;border-radius:18px;background:#ffcb52;color:#33205b;padding:12px 25px;font-size:21px;font-weight:800}.overlay{position:fixed;inset:0;background:#100b2cba;display:grid;place-items:center;padding:20px;z-index:10}.overlay[hidden]{display:none}.dialog{background:#fff;color:#42247d;padding:35px 24px;border-radius:30px;max-width:430px;width:100%;text-align:center;display:flex;flex-direction:column;gap:18px;border:5px solid #b795ed}.dialog h2{font-size:32px;margin:0}.dialog p{font-size:21px;margin:0}.restart{border:0;border-radius:16px;background:#7d45d6;color:white;font-size:22px;font-weight:bold;padding:15px}
@media(max-width:620px){.app{gap:9px;padding:9px}header{flex-wrap:wrap}h1{order:-1;width:100%}.panel{border-radius:18px;padding:10px;gap:9px}.options{gap:6px}.choice{border-width:2px;border-radius:16px;min-height:105px}.picture{font-size:clamp(43px,10vw,70px)}.word{font-size:17px}.sound{font-size:clamp(25px,8vw,43px)}.listen{padding:10px 15px;font-size:18px}.phase{font-size:21px}}
.win-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.win-links[hidden]{display:none}.win-links a{background:#7540ca;color:white;padding:12px 14px;border-radius:14px;text-decoration:none;font-weight:bold}.win-links a:last-child{background:#ffcb52;color:#2d195c}</style></head><body><div class="app">
<header><a class="home" href="level1.html">⌂ למפה</a><h1>🔎 בלשי הצלילים</h1><div class="stats"><span id="hearts" class="hearts">❤️❤️❤️</span><span id="points">0 נק׳</span></div></header>
<div class="stage" id="stage">משימה 1 מתוך 12</div><div class="progress"><div id="bar" style="width:0%"></div></div>
<main class="panel"><div class="phase" id="phase">איזו תמונה מתאימה למילה ששמעת?</div><div class="help" id="help">לחצו על הרמקול והקשיבו למילה באנגלית</div><button class="listen" id="listen" onclick="sayCurrent()">🔊 השמיעו את המילה</button><div class="options" id="options"></div><div class="message" id="message" aria-live="polite"></div><button class="next" id="next" onclick="advance()" disabled>ממשיכים ←</button></main>
<div class="overlay" id="overlay" hidden><div class="dialog"><h2 id="modalTitle">לא נורא, נסו שוב 💜</h2><p id="modalText">נגמרו הלבבות</p><div class="win-links" id="winLinks" hidden><a href="level1.html">🗺️ חזרה למפה</a><a href="level1.html">🚀 מעבר לשלב הבא במפה</a></div><button class="restart" id="restartButton" onclick="restart()">↻ מתחילים מחדש</button></div></div>
</div><script>
const tasks=[
{word:"SHIP",emoji:"🚢",sound:"SH",options:["SHIP","CHIP","TRAIN"]},
{word:"CHAIR",emoji:"🪑",sound:"CH",options:["CHAIR","CHEESE","SHOE"]},
{word:"TREE",emoji:"🌳",sound:"EE",options:["TREE","MOON","TRAIN"]},
{word:"MOON",emoji:"🌙",sound:"OO",options:["MOON","BOOK","SPOON"]},
{word:"FISH",emoji:"🐟",sound:"SH",options:["FISH","DISH","SHELL"]},
{word:"CHEESE",emoji:"🧀",sound:"CH",options:["CHEESE","CHAIR","SHEEP"]},
{word:"SHEEP",emoji:"🐑",sound:"EE",options:["SHEEP","SHIP","SHOE"]},
{word:"SPOON",emoji:"🥄",sound:"OO",options:["SPOON","MOON","BOOK"]},
{word:"SHOE",emoji:"👟",sound:"SH",options:["SHOE","SHIP","CHAIR"]},
{word:"CHICK",emoji:"🐥",sound:"CH",options:["CHICK","FISH","CHEESE"]},
{word:"BEE",emoji:"🐝",sound:"EE",options:["BEE","TREE","SHEEP"]},
{word:"ZOO",emoji:"🦓",sound:"OO",options:["ZOO","MOON","SPOON"]}
];
const emojis={SHIP:"🚢",CHIP:"🍟",SHEEP:"🐑",CHAIR:"🪑",CHEESE:"🧀",SHOE:"👟",TREE:"🌳",MOON:"🌙",TRAIN:"🚂",BOOK:"📖",SPOON:"🥄",FISH:"🐟",DISH:"🍽️",SHELL:"🐚",CHICK:"🐥",BEE:"🐝",ZOO:"🦓"};
let index=0,phase=0,lives=3,points=0,locked=false,selected=null;
function speak(t){if(!("speechSynthesis" in window)){document.getElementById("message").textContent="הדפדפן לא תומך בהשמעת קול";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang="en-US";u.rate=.76;const v=speechSynthesis.getVoices().find(v=>v.lang==="en-US")||speechSynthesis.getVoices().find(v=>v.lang.startsWith("en"));if(v)u.voice=v;speechSynthesis.speak(u)}
function sayCurrent(){speak(tasks[index].word)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
 locked=false;selected=null;document.getElementById("hearts").textContent="❤️".repeat(lives)+"♡".repeat(3-lives);
 document.getElementById("points").textContent=points+" נק׳";document.getElementById("stage").textContent="משימה "+(index+1)+" מתוך "+tasks.length+" · "+(phase===0?"מזהים תמונה":"מגלים צליל");
 document.getElementById("bar").style.width=((index+(phase/2))/tasks.length*100)+"%";
 document.getElementById("phase").textContent=phase===0?"איזו תמונה מתאימה למילה ששמעת?":"איזה צמד אותיות מסתתר במילה?";
 document.getElementById("help").textContent=phase===0?"לחצו על הרמקול והקשיבו למילה באנגלית":"מצאו את שתי האותיות שמתחברות לצליל מיוחד";
 document.getElementById("listen").textContent="🔊 השמיעו את המילה";
 document.getElementById("message").textContent="";document.getElementById("next").disabled=true;
 const box=document.getElementById("options");box.innerHTML="";
 const task=tasks[index];const options=phase===0?shuffle(task.options):shuffle(["SH","CH","EE","OO"].filter(x=>x!==task.sound).slice(0,2).concat(task.sound));
 options.forEach(value=>{const b=document.createElement("button");b.className="choice";b.type="button";b.setAttribute("aria-label",value);if(phase===0){const em=document.createElement("span");em.className="picture";em.textContent=emojis[value];b.appendChild(em)}else{const span=document.createElement("span");span.className="sound";span.textContent=value;b.appendChild(span)}b.addEventListener("click",()=>choose(value,b));box.appendChild(b)});
}
function choose(value,button){
 if(locked||lives<=0)return;const correct=phase===0?tasks[index].word:tasks[index].sound;
 if(value===correct){locked=true;button.classList.add("correct");points+=10;document.getElementById("points").textContent=points+" נק׳";document.getElementById("message").textContent=phase===0?"נכון! זיהיתם את התמונה 🎉":"כל הכבוד! הצליל הוא "+correct+" ⭐";document.getElementById("next").disabled=false;document.querySelectorAll(".choice").forEach(b=>b.disabled=true)}
 else{lives--;button.classList.add("wrong");button.disabled=true;document.getElementById("hearts").textContent="❤️".repeat(lives)+"♡".repeat(3-lives);document.getElementById("message").textContent="נסו שוב 💜";if(lives===0){locked=true;showModal(false)}}
}
function advance(){if(!locked)return;if(phase===0){phase=1;render()}else if(index<tasks.length-1){index++;phase=0;render()}else{showModal(true)}}
function showModal(win){if("speechSynthesis" in window)speechSynthesis.cancel();document.getElementById("modalTitle").textContent=win?"🏆 כל הכבוד!":"💜 לא נורא, נסו שוב";document.getElementById("modalText").textContent=win?"השלמתם את המשימה בהצלחה! 🎉 צברתם "+points+" נקודות!":"נגמרו הלבבות. אפשר לנסות שוב!";document.getElementById("winLinks").hidden=!win;document.getElementById("restartButton").hidden=win;document.getElementById("overlay").hidden=false;(win?document.querySelector("#winLinks a"):document.querySelector(".restart")).focus()}
function restart(){document.getElementById("overlay").hidden=true;index=0;phase=0;lives=3;points=0;render()}
render();
</script></body></html>
