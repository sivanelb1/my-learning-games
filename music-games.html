<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>משחקי Sing & Sparkle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#e8e1ff,#dff7ff 50%,#fff0d9);color:#283b60;text-align:center;min-height:100vh}main{max-width:960px;margin:auto;padding:20px 15px 50px}.back{display:inline-block;background:#fff;border-radius:15px;padding:10px 18px;color:#6b48a9;text-decoration:none;font-weight:bold}h1{font-size:clamp(28px,5vw,48px);margin:14px 0 4px}.lead{font-size:18px;line-height:1.5}.hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px;padding:12px;background:#ffffffd9;border-radius:17px;margin:15px 0;font-weight:bold}.arena{position:relative;background:linear-gradient(150deg,#fffef9,#e8f7ff);border:4px solid #ad9be1;border-radius:28px;min-height:400px;padding:23px 15px;overflow:hidden;box-shadow:0 14px 30px #493d7822}.prompt{background:#fff2c2;border-radius:19px;padding:18px;margin:4px auto 20px;max-width:670px;min-height:105px;font-size:clamp(21px,3vw,30px);font-weight:bold}.prompt small{display:block;font-size:16px;font-weight:normal;margin-top:6px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;direction:ltr}.choice{border:3px solid #b2a4e4;background:#f6f0ff;border-radius:20px;min-height:125px;padding:13px 7px;color:#3a356f;font:bold clamp(20px,3vw,29px) Arial;cursor:pointer;transition:transform .15s,background .15s;touch-action:manipulation}.choice:hover,.choice:focus-visible{transform:translateY(-4px);outline:3px solid #ffd26f}.choice:disabled{cursor:default}.choice .emoji{display:block;font-size:clamp(32px,5vw,58px);margin-bottom:8px}.choice.correct{background:#c5f4d6;border-color:#42a87b}.choice.wrong{background:#ffd5d7;border-color:#e67883}.status{min-height:40px;margin:15px 0;font-weight:bold;font-size:19px}.sequence{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px 0}.sequence span{background:#fff1b5;padding:7px 11px;border-radius:9px;font-weight:bold}.floating .choice{border-radius:50%;min-height:125px;animation:float 2.7s ease-in-out infinite}.floating .choice:nth-child(2){animation-delay:-1s}.floating .choice:nth-child(3){animation-delay:-1.8s}@keyframes float{50%{transform:translateY(-12px)}}.farm .choice{background:#e5f9d9}.disco .choice{background:#37295e;color:#fff;border-color:#aa7bdb;box-shadow:0 0 18px #bd8cff77}.jungle .choice{background:#d3eed3;border-color:#4c996e}.night .choice{background:#2d3e83;color:#fff;border-color:#a3b4f7}.dance .choice{background:#fff0ce}.train .choice{background:#e4f4ff}.count .choice{background:#f8e9d7}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}.controls button{border:0;border-radius:14px;padding:12px 20px;background:#7753b8;color:white;font:bold 17px Arial;cursor:pointer}.controls button:disabled{opacity:.5}.overlay{position:absolute;inset:0;background:#1b2c50ee;color:#fff;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:25px;gap:16px}.overlay[hidden]{display:none}.overlay h2{font-size:clamp(27px,5vw,41px);margin:0}.overlay p{font-size:19px;max-width:590px;line-height:1.6}.overlay button{background:#ffe3a0;color:#303f62;border:0;border-radius:17px;padding:15px 28px;font:bold 22px Arial;cursor:pointer}.guide{margin:16px auto;color:#465a76;font-size:15px}@media(max-width:560px){.arena{min-height:390px;padding:12px 8px}.options{gap:7px}.choice{min-height:100px;padding:8px 3px}.choice .emoji{font-size:36px}.hud{font-size:15px}.floating .choice{min-height:105px}}
</style></head><body><main><a class="back" id="back" href="sing-and-sparkle.html">🎶 חזרה לשיר</a><h1 id="title">🎵 המשחק המוזיקלי</h1><p class="lead" id="subtitle"></p><div class="hud"><span id="score">⭐ 0</span><span id="progress">משימה 1 / 8</span><span id="lives">❤️❤️❤️</span></div><section class="arena" id="arena"><div class="prompt" id="prompt"></div><div class="sequence" id="sequence"></div><div class="options" id="options"></div><p class="status" id="status" role="status" aria-live="polite"></p><div class="controls"><button id="listen">🔊 לשמוע שוב</button><button id="restart">🔄 להתחיל מחדש</button></div><div class="overlay" id="overlay"><h2 id="overlayTitle"></h2><p id="overlayText"></p><button id="start">יאללה, משחקים! 🎮</button></div></section><p class="guide">אפשר לשחק גם בלי לשמוע. אחרי תשובה נכונה שומעים את המילה באנגלית.</p></main><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),key=params.get('song')||'abc';
const configs={
abc:{title:'🔤 רכבת האלפבית המוזיקלית',subtitle:'סדרו את האותיות ברכבת לפי הסדר!',mode:'train',page:'abc-song.html',words:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x=>[x,x,'🚃']),rounds:26},
shark:{title:'🦈 מסיבת הבועות',subtitle:'פוצצו את הבועה עם המילה המתאימה לתמונה!',mode:'floating',page:'baby-shark-song.html',words:[['baby','תינוק','👶'],['shark','כריש','🦈'],['mommy','אמא','👩'],['daddy','אבא','👨'],['grandma','סבתא','👵'],['grandpa','סבא','👴'],['run','לרוץ','🏃'],['safe','בטוח','🛟']],rounds:10},
farm:{title:'🐮 החווה המבולגנת',subtitle:'החזירו את החיות הנכונות לחווה!',mode:'farm',page:'old-macdonald-song.html',words:[['cow','פרה','🐄'],['pig','חזיר','🐷'],['duck','ברווז','🦆'],['dog','כלב','🐶'],['sheep','כבשה','🐑'],['horse','סוס','🐴']],rounds:10},
monkeys:{title:'🐒 הקופים הקופצים',subtitle:'ספרו את הקופים ובחרו את המספר המתאים!',mode:'count',page:'five-little-monkeys-song.html',words:[['one','אחד','🐒'],['two','שניים','🐒🐒'],['three','שלושה','🐒🐒🐒'],['four','ארבעה','🐒🐒🐒🐒'],['five','חמישה','🐒🐒🐒🐒🐒']],rounds:10},
unicorn:{title:'🦄 במת הכוכבים',subtitle:'השלימו את המשפטים כדי להדליק את הבמה!',mode:'stage',page:'unicorn-song.html',words:[['power','כוח','⚡'],['star','כוכב','⭐'],['magic','קסם','✨'],['strong','חזק','💪'],['dream','חלום','🌈'],['shine','לזרוח','🌟'],['light','אור','💡'],['dance','לרקוד','💃']],rounds:10},
shake:{title:'💃 אתגר הריקודים',subtitle:'קראו את ההוראה ובחרו את התנועה הנכונה!',mode:'dance',page:'shake-it-off-song.html',words:[['shake','לנער','🫨'],['dance','לרקוד','💃'],['move','לזוז','🏃'],['stop','לעצור','🛑'],['play','לנגן','🎸'],['heart','לב','❤️']],rounds:10},
feeling:{title:'🪩 רצפת הדיסקו',subtitle:'קפצו על האריח שמתאים למילה!',mode:'disco',page:'cant-stop-the-feeling-song.html',words:[['dance','לרקוד','💃'],['feel','להרגיש','💛'],['good','טוב','👍'],['body','גוף','🕺'],['move','לזוז','🏃'],['sun','שמש','☀️'],['light','אור','💡'],['stop','לעצור','🛑']],rounds:10},
happy:{title:'☀️ עיר הרגשות',subtitle:'מצאו את התמונה שמתאימה למילה!',mode:'emotion',page:'happy-song.html',words:[['happy','שמח','😊'],['feel','להרגיש','💗'],['smile','חיוך','😄'],['good','טוב','👍'],['clap','מחיאות כפיים','👏'],['hands','ידיים','🙌'],['room','חדר','🚪'],['sun','שמש','☀️']],rounds:10},
roar:{title:'🦁 הרפתקת הג׳ונגל',subtitle:'פתחו את שער הג׳ונגל עם התשובה הנכונה!',mode:'jungle',page:'roar-song.html',words:[['eye','עין','👁️'],['fire','אש','🔥'],['lion','אריה','🦁'],['hear','לשמוע','👂'],['voice','קול','🎤'],['loud','חזק','📣'],['stand','לעמוד','🧍'],['strong','חזק מאוד','💪']],rounds:10},
night:{title:'✨ מסלול האורות',subtitle:'אספו את המילים שמדליקות את המסלול!',mode:'night',page:'dance-the-night-song.html',words:[['dance','לרקוד','💃'],['night','לילה','🌙'],['light','אור','💡'],['heart','לב','❤️'],['music','מוזיקה','🎶'],['move','לזוז','🕺'],['shine','לזרוח','✨'],['cry','לבכות','😢']],rounds:10}
};
const c=configs[key]||configs.abc;document.title=c.title+' | PLAYWISE';$('title').textContent=c.title;$('subtitle').textContent=c.subtitle;$('back').href=c.page;$('arena').classList.add(c.mode);
let round=0,score=0,lives=3,locked=true,answer=null,used=[],timer=null,runId=0;
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function speak(word){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.78;const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('en'));if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
function update(){ $('score').textContent='⭐ '+score;$('progress').textContent='משימה '+Math.min(round+1,c.rounds)+' / '+c.rounds;$('lives').textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives);$('sequence').replaceChildren(...used.slice(-13).map(w=>{const s=document.createElement('span');s.textContent=w;return s}))}
function show(title,text,button){locked=true;$('overlayTitle').textContent=title;$('overlayText').textContent=text;$('start').textContent=button;$('overlay').hidden=false}
function next(){
 if(round>=c.rounds){show('🏆 איזה כוכבים!','סיימתם את '+c.rounds+' המשימות וצברתם '+score+' כוכבים!','לשחק שוב');return}
 locked=false;const words=c.words;
 answer=c.mode==='train'?words[round]:words[round%words.length];
 if(c.mode!=='train'&&round>0&&round%words.length===0)shuffle(words);
 let pool=shuffle(words.filter(w=>w!==answer)).slice(0,2);let options=shuffle([answer,...pool]);
 const mode=c.mode,visual=mode==='farm'||mode==='count'||mode==='emotion'||mode==='dance'||mode==='night';
 let prompt='';
 if(mode==='train')prompt='🚂 מצאו את האות הבאה ברכבת <small>מתחילים ב־A, ואז ממשיכים לפי הסדר. הביטו בקרונות שכבר אספתם.</small>';
 else if(mode==='floating')prompt='מי נמצא בתמונה? <span style="display:block;font-size:65px">'+answer[2]+'</span><small>בחרו את הבועה עם המילה באנגלית</small>';
 else if(mode==='farm')prompt='🐄 איזו חיה נקראת <span dir="ltr">'+answer[0]+'</span>?<small>בחרו את החיה המתאימה והחזירו אותה לחווה</small>';
 else if(mode==='count')prompt='כמה קופים יש כאן? <span style="display:block;font-size:38px">'+answer[2]+'</span><small>בחרו את המספר באנגלית</small>';
 else if(mode==='stage')prompt='✨ השלימו: I have ___ <small>רמז בעברית: '+answer[1]+'</small>';
 else if(mode==='dance')prompt='🎵 '+answer[0].toUpperCase()+'! <small>איזו תנועה או תמונה מתאימה להוראה?</small>';
 else if(mode==='disco')prompt='🪩 מצאו את האריח: '+answer[1]+' <small>בחרו את המילה באנגלית</small>';
 else if(mode==='emotion')prompt='☀️ מה התמונה של המילה '+answer[0]+'?';
 else if(mode==='jungle')prompt='🦁 פתחו את השער! מה פירוש '+answer[0]+'?';
 else prompt='✨ אספו את התמונה המתאימה ל־'+answer[0]+'!';
 $('prompt').innerHTML=prompt;
 $('status').textContent='בחרו תשובה אחת מתוך שלוש!';
 $('options').replaceChildren(...options.map(w=>{const b=document.createElement('button');b.className='choice';b.type='button';b.dataset.word=w[0];const picture=visual||mode==='floating';if(picture&&mode!=='floating'){const span=document.createElement('span');span.className='emoji';span.textContent=w[2];b.append(span)}const txt=document.createElement('span');txt.textContent=mode==='jungle'?w[1]:mode==='farm'||mode==='emotion'||mode==='dance'||mode==='night'?w[1]:w[0];b.append(txt);b.onclick=()=>pick(w,b);return b}));
 update();
}
function pick(w,b){if(locked)return;locked=true;const correct=w===answer;
 b.classList.add(correct?'correct':'wrong');
 if(correct){score++;used.push(answer[0]);$('status').textContent='⭐ מעולה! '+answer[0]+' — '+answer[1];speak(answer[0]);round++;if(round%5===0&&lives<3)lives++;}else{lives--;$('status').textContent='כמעט! נסו לזכור את המילה בפעם הבאה.';if(lives===0){update();show('❤️ נגמרו החיים','צברתם '+score+' כוכבים. אפשר לנסות שוב!','לנסות שוב');return}else{round++}}
 update();const id=runId;timer=setTimeout(()=>{if(id===runId)next()},900);
}
function start(){runId++;clearTimeout(timer);round=0;score=0;lives=3;used=[];$('overlay').hidden=true;next()}
$('start').onclick=start;$('restart').onclick=()=>{clearTimeout(timer);start()};$('listen').onclick=()=>{if(!locked&&answer)speak(answer[0])};
show('🎮 מוכנים למשחק?',c.subtitle+' בכל סיבוב בוחרים תשובה אחת מתוך שלוש. יש לכם שלושה חיים, וכל חמש תשובות נכונות אפשר לקבל לב נוסף.','יאללה, מתחילים!');
</script></body></html>
