<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYWISE | כניסת תלמידים</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(125deg,#f0eaff,#e7faff);font-family:Arial,sans-serif;color:#28234d;padding:16px;box-sizing:border-box}.card{background:white;border-radius:28px;box-shadow:0 14px 40px #31255b22;padding:35px;max-width:490px;width:100%;box-sizing:border-box}h1{color:#392075}label{display:block;margin:17px 0 7px;font-weight:bold}input{box-sizing:border-box;width:100%;border:1px solid #c4bddf;border-radius:12px;padding:13px;font:inherit}button,.go{display:inline-block;background:#6552dc;border:0;border-radius:13px;padding:14px 20px;color:white;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;margin-top:20px}button:disabled{opacity:.6}p{line-height:1.6}.muted{color:#6d6a81}.error{color:#ad2345}.hidden{display:none!important}a{color:#5746bd}</style></head><body><main class="card"><h1>🎓 PLAYWISE</h1><section id="login"><h2>כניסה לתלמידים</h2><p class="muted">נכנסים עם כתובת המייל והסיסמה שקיבלתם מהמורה.</p><form id="form"><label for="email">כתובת מייל</label><input id="email" type="email" autocomplete="username" required><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">🔐 כניסה למשחקים</button></form><p id="message" role="alert"></p></section><section id="welcome" class="hidden"><h2 id="greeting">ברוכים הבאים!</h2><p id="access"></p><a class="go" href="index.html">🎮 מעבר למשחקים</a><p class="muted">שימו לב: הגבלת הגישה בתוך דפי המשחקים עדיין בפיתוח.</p><p><button id="logout">התנתקות</button></p></section><p><a href="index.html">חזרה לאתר</a></p></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBPuo0HcIfWIQ-kBA3bj4FUxyP1TTDxnp4",authDomain:"playwise-learning.firebaseapp.com",projectId:"playwise-learning",storageBucket:"playwise-learning.firebasestorage.app",messagingSenderId:"39738730345",appId:"1:39738730345:web:ada6b886306aaa62613ff8",measurementId:"G-T2G6DGPXE7"});
const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),adminUid="h08EuZLscigEG3xE0xz81ycISOA2";
async function showUser(user){if(!user){$("login").classList.remove("hidden");$("welcome").classList.add("hidden");return}try{if(user.uid===adminUid){$("greeting").textContent="שלום, מנהלת PLAYWISE!";$("access").textContent="לחשבון המנהלת יש גישה קבועה."; $("login").classList.add("hidden");$("welcome").classList.remove("hidden");return}
const snap=await getDoc(doc(db,"memberships",user.uid));if(!snap.exists()){await signOut(auth);$("message").textContent="עדיין לא הוגדרה הרשאה לחשבון הזה. פנו למורה.";return}
const m=snap.data(),today=new Date().toISOString().slice(0,10);
if(m.disabled||!m.expiresAt||m.expiresAt<today){await signOut(auth);$("message").textContent="ההרשאה לחשבון אינה פעילה. פנו למורה.";return}
$("greeting").textContent="שלום "+(m.name||"תלמיד/ה")+"! 🎉";$("access").textContent="ההרשאה שלך פעילה עד "+new Date(m.expiresAt+"T12:00:00").toLocaleDateString("he-IL");$("login").classList.add("hidden");$("welcome").classList.remove("hidden");
}catch(e){$("message").textContent="לא הצלחנו לבדוק את ההרשאה. קוד: "+(e.code||"לא ידוע");$("login").classList.remove("hidden");$("welcome").classList.add("hidden")}}
onAuthStateChanged(auth,showUser);
$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;$("message").textContent="בודקים פרטים...";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("message").textContent=""}catch(err){$("message").textContent=err.code==="auth/invalid-credential"?"כתובת המייל או הסיסמה שגויות.":("לא הצלחנו להתחבר. קוד: "+err.code)}finally{$("submit").disabled=false}};
$("logout").onclick=()=>signOut(auth);
</script></body></html>
