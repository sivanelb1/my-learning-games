<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYWISE | שער האותיות</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}body{background:#27134f;color:#fff}button{font:inherit;cursor:pointer}.world{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(180deg,#28207033,#7144b233),url("ממלכת הפנטזיה הזוהרת והטירה הקסומה.png") center center/cover no-repeat,#5e3b9b}.world:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#210c47a8 0%,transparent 30%,transparent 75%,#1d0d43a1)}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff9 1.5px,transparent 2px),radial-gradient(#ffe49d99 2px,transparent 3px);background-size:93px 89px,137px 151px;animation:twinkle 7s linear infinite}@keyframes twinkle{50%{opacity:.4}}.top{position:absolute;z-index:15;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.wood,.badge,.banner,.prompt{border:2px solid #ffd989;box-shadow:0 5px 15px #16082f88,inset 0 0 14px #ffcc7938}.wood{background:linear-gradient(#8a4e2a,#54311f);color:#fff4cc;text-decoration:none;border-radius:15px;padding:10px 15px;font-weight:800;font-size:clamp(11px,1.6vw,16px)}.banner{text-align:center;background:linear-gradient(#7e42ad,#3c1a76);border-radius:20px;padding:9px 23px;max-width:50vw}.banner strong{display:block;font-family:Georgia,serif;color:#ffe6a3;font-size:clamp(18px,3vw,32px)}.banner small{font-weight:800;color:#fff0cf}.badge{background:#39206e;border-radius:17px;padding:11px;font-size:clamp(13px,2vw,20px);white-space:nowrap}.prompt{position:absolute;top:105px;left:50%;transform:translateX(-50%);z-index:14;width:min(790px,92%);padding:13px 16px;background:linear-gradient(110deg,#fff7e4,#ffe9c2);border-radius:23px;color:#44206d;text-align:center;font-size:clamp(18px,3vw,29px);font-weight:900}.prompt .letter{color:#7131a1;font-size:1.5em}.prompt button{background:#7640b3;color:white;border:0;border-radius:50%;width:43px;height:43px;margin-inline-end:8px}.sky{position:absolute;inset:0;z-index:8;overflow:hidden}.balloon{position:absolute;left:0;top:0;width:clamp(105px,16vw,185px);height:clamp(150px,22vw,250px);border:0;background:transparent;filter:drop-shadow(0 9px 7px #1d0e4d66);will-change:transform;touch-action:manipulation;user-select:none;outline-offset:5px}.cap{position:absolute;top:4%;left:4%;width:92%;height:52%;border-radius:54% 54% 35% 35%/78% 78% 24% 24%;background:radial-gradient(ellipse at 36% 20%,#ffffff77,transparent 30%),linear-gradient(145deg,var(--light),var(--color) 65%,#6a2480);border:3px solid #ffda9c;box-shadow:inset 0 -13px 0 #f9c881,0 0 18px #f9a8ff9e}.cap:before{content:"";position:absolute;inset:10%;border-radius:inherit;background:radial-gradient(ellipse at 18% 30%,white 0 9%,transparent 10%),radial-gradient(ellipse at 66% 20%,white 0 10%,transparent 11%),radial-gradient(ellipse at 82% 65%,white 0 8%,transparent 9%),radial-gradient(ellipse at 35% 72%,white 0 7%,transparent 8%);opacity:.83}.answer{position:absolute;z-index:2;top:18%;left:31%;width:38%;height:29%;border-radius:50%;display:grid;place-items:center;background:#fff4dc;color:#3f175b;border:3px solid #eac888;font:bold clamp(35px,6vw,65px) Georgia,serif;box-shadow:0 0 14px #fff9}.ropes{position:absolute;top:51%;left:30%;width:40%;height:21%;border-left:3px solid #e8b967;border-right:3px solid #e8b967;transform:perspective(50px) rotateX(15deg)}.basket{position:absolute;top:70%;left:24%;width:52%;height:24%;border:3px solid #e4b55c;border-radius:10px 10px 24px 24px;background:repeating-linear-gradient(0deg,#8e502a 0 8px,#ad7137 9px 13px);box-shadow:inset 0 6px #d5a45b}.balloon.hit .cap{filter:brightness(1.5);box-shadow:0 0 35px #fff4aa}.balloon.miss{animation:shake .35s}@keyframes shake{25%{filter:drop-shadow(0 0 12px red)}75%{filter:drop-shadow(0 0 12px red)}}.footer{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:12px;max-width:95%;background:#2d165cda;border:2px solid #eac785;border-radius:18px;padding:10px 16px;text-align:center;font-weight:800;font-size:clamp(12px,1.8vw,18px)}.footer button{border:0;border-radius:12px;background:#ffdf8a;color:#4a2675;font-weight:bold;padding:8px}.feedback{position:absolute;top:190px;left:50%;transform:translateX(-50%);z-index:16;background:#fff2d5;color:#59247b;padding:8px 20px;border-radius:20px;font-size:22px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none}.feedback.visible{opacity:1}.overlay{position:absolute;inset:0;z-index:30;background:#160b38b9;display:grid;place-items:center;padding:20px}.overlay.hidden{display:none}.modal{background:linear-gradient(#fff8e5,#f5e0ff);color:#4d2671;border:5px solid #e6c279;border-radius:28px;padding:30px;max-width:520px;text-align:center;box-shadow:0 20px 60px #0008}.modal h2{font-size:32px}.modal p{line-height:1.7}.modal button{border:0;background:#7845b6;color:white;border-radius:17px;padding:13px 23px;font-weight:800;font-size:19px}.modal a{display:inline-block;margin:10px;color:#6737a1;font-weight:bold}.spark{position:absolute;z-index:13;pointer-events:none;font-size:32px;animation:pop .8s ease-out forwards}@keyframes pop{to{opacity:0;transform:translateY(-90px) scale(1.8)}}@media(max-width:650px){.banner{padding:7px 10px;max-width:45vw}.wood{padding:9px}.badge{padding:9px}.prompt{top:90px}.feedback{top:168px}.footer{width:96%;justify-content:center}.balloon{width:112px;height:157px}.answer{font-size:40px}}@media(prefers-reduced-motion:reduce){.stars{animation:none}}
</style></head><body><main class="world" id="world"><div class="stars"></div><div class="top"><a class="wood" href="adventure-map.html">🏰 מפת הממלכה</a><div class="banner"><strong>🧚‍♀️ The Letter Gate</strong><small>שער האותיות · ABC Review</small></div><div class="badge" id="hud">⭐ 0 / 10 &nbsp; ❤️❤️❤️</div></div><div class="prompt" id="prompt" aria-live="polite"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="sky" id="sky" aria-label="שבע פטריות מרחפות עם אותיות קבועות"></div><div class="footer"><span>🍄 לחצו על הפטרייה עם האות הנכונה!</span><button id="pause" type="button">⏸️ עצירה</button></div><div class="overlay" id="overlay"><div class="modal" id="modal"><div style="font-size:65px">🧚‍♀️🍄✨</div><h2>שער האותיות</h2><p>שבע פטריות קסומות מרחפות בשמיים! מצאו את האות הקטנה המתאימה. האותיות נשארות על הפטריות בזמן שהן עפות, וכשבוחרים נכון פטרייה חדשה מצטרפת.</p><button id="begin">✨ מתחילים לשחק!</button></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),sky=$('sky'),world=$('world');const pairs=[['A','a'],['B','b'],['C','c'],['D','d'],['E','e'],['F','f'],['G','g'],['H','h'],['I','i'],['J','j'],['K','k'],['L','l'],['M','m'],['N','n'],['O','o'],['P','p'],['Q','q'],['R','r'],['S','s'],['T','t'],['U','u'],['V','v'],['W','w'],['X','x'],['Y','y'],['Z','z']];const colors=[['#db55a8','#ff9acb'],['#7c42c6','#cb86ff'],['#ec8433','#ffc26b'],['#369ec1','#9be5f6'],['#c94472','#ff9aa5']];let balloons=[],spawnIndex=7,running=false,paused=false,last=0,question=0,score=0,lives=3,active=null,questions=[],nextId=0,transition=false,feedbackTimer;const rand=(a,b)=>a+Math.random()*(b-a);const shuffle=a=>a.slice().sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}catch(e){}}function makeQuestions(){questions=shuffle(pairs).slice(0,10).map(p=>({upper:p[0],lower:p[1]}))}function updateHud(){$('hud').textContent='⭐ '+score+' / 10  '+('❤️'.repeat(lives))}function showQuestion(){active=questions[question];$('prompt').innerHTML='<button id="hear" aria-label="השמיעו את שם האות">🔊</button> Find the small letter for <span class="letter" dir="ltr">'+active.upper+'</span> ?';$('hear').onclick=()=>speak(active.upper)}function feedback(text){clearTimeout(feedbackTimer);$('feedback').textContent=text;$('feedback').classList.add('visible');feedbackTimer=setTimeout(()=>$('feedback').classList.remove('visible'),1050)}function newBalloon(value,x,y){const id=nextId++,el=document.createElement('button');el.type='button';el.className='balloon';el.setAttribute('aria-label','האות '+value);const [color,light]=colors[id%colors.length];el.style.setProperty('--color',color);el.style.setProperty('--light',light);el.innerHTML='<span class="cap"></span><span class="answer" dir="ltr"></span><span class="ropes"></span><span class="basket"></span>';el.querySelector('.answer').textContent=value;const b={id,el,value,x,y,phase:rand(0,7),speed:rand(9,17),w:Math.min(185,Math.max(105,innerWidth*.16)),alive:true};el.onclick=()=>pick(b);sky.append(el);balloons.push(b);return b}function initBalloons(){sky.innerHTML='';balloons=[];spawnIndex=7;const w=world.clientWidth,h=world.clientHeight;const count=7;for(let i=0;i<count;i++){const row=i<4?0:1,col=row===0?i:i-4,columns=row===0?4:3;const x=(col+.1)*w/columns;const y=row===0?Math.max(180,h*.28):Math.max(335,h*.58);newBalloon(questions[i].lower,x,y)}}function replaceCorrect(b){b.alive=false;b.el.remove();balloons=balloons.filter(v=>v!==b);if(spawnIndex<questions.length){const next=questions[spawnIndex++];const w=world.clientWidth,h=world.clientHeight;const y=Math.max(180,h*(spawnIndex%2?.31:.57));newBalloon(next.lower,w+15,y)}else if(question<questions.length-1){const remaining=questions.slice(question+1).map(q=>q.lower);const fillers=pairs.map(p=>p[1]).filter(v=>!remaining.includes(v)&&!balloons.some(x=>x.value===v));if(fillers.length)newBalloon(fillers[Math.floor(Math.random()*fillers.length)],world.clientWidth+15,Math.max(200,h*.43))}}function sparkle(b){for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','💫'][i%3];s.style.left=(b.x+b.w/2+rand(-50,50))+'px';s.style.top=(b.y+rand(0,90))+'px';world.append(s);setTimeout(()=>s.remove(),850)}}function pick(b){if(!running||paused||transition||!b.alive)return;if(b.value===active.lower){transition=true;score++;updateHud();b.el.classList.add('hit');sparkle(b);feedback('✨ קסם! כל הכבוד!');setTimeout(()=>{replaceCorrect(b);question++;if(question>=questions.length){finish();return}showQuestion();transition=false},700)}else{lives--;updateHud();b.el.classList.add('miss');setTimeout(()=>b.el.classList.remove('miss'),420);feedback('💜 נסו שוב!');if(lives===0){paused=true;showOverlay('💜 עוד ניסיון!','הפיות מחכות לכם. אפשר לנסות שוב בלי לאבד את ההתקדמות.','ממשיכים לשחק',()=>{lives=3;updateHud();paused=false;last=performance.now()})}}}function showOverlay(icon,title,button,action){$('modal').innerHTML='<div style="font-size:60px">'+icon+'</div><h2>'+title+'</h2><p>הקסם ממשיך בממלכת האותיות ✨</p><button id="modalAction">'+button+'</button>';$('overlay').classList.remove('hidden');$('modalAction').onclick=()=>{$('overlay').classList.add('hidden');action()}}function finish(){running=false;paused=true;try{const key='playwise-level2-royal-quest-v1';let completed=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(completed))completed=[];if(!completed.includes(0)){completed.push(0);localStorage.setItem(key,JSON.stringify(completed))}}catch(e){}$('modal').innerHTML='<div style="font-size:75px">💎👑🧚‍♀️</div><h2>שער האותיות נפתח!</h2><p>מצאתם 10 אותיות והחזרתם אבן קסם לממלכה!</p><a href="adventure-map.html">🏰 מפת הממלכה</a><br><button id="again">🔄 משחקים שוב</button>';$('overlay').classList.remove('hidden');$('again').onclick=()=>{$('overlay').classList.add('hidden');begin()}}function tick(t){if(!running)return;const dt=Math.min((t-last)/1000,.05);last=t;if(!paused){const w=world.clientWidth,h=world.clientHeight;for(const b of balloons){if(!b.alive)continue;b.x-=b.speed*dt;b.el.style.transform='translate('+b.x+'px,'+(b.y+Math.sin(t/800+b.phase)*13)+'px)';if(b.x< -b.w-20){b.x=w+rand(15,85);b.y=rand(Math.max(190,h*.28),Math.max(300,h*.61))}}}requestAnimationFrame(tick)}function begin(){running=false;score=0;lives=3;question=0;transition=false;paused=false;makeQuestions();active=questions[0];updateHud();initBalloons();showQuestion();running=true;last=performance.now();requestAnimationFrame(tick)}$('begin').onclick=()=>{$('overlay').classList.add('hidden');begin()};$('pause').onclick=()=>{if(!running)return;paused=!paused;$('pause').textContent=paused?'▶️ המשך':'⏸️ עצירה';last=performance.now()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='▶️ המשך'}});window.addEventListener('resize',()=>{for(let b of balloons)b.y=Math.min(b.y,world.clientHeight*.7)});})();
</script></body></html>
